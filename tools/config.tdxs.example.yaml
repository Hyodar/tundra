
# Transport configuration
transport:
  type: socket
  config:
    file_path: ./tdxs.sock
    owner: root
    group: root
    perm: 0660

# Issuer configuration
issuer:
  type: simulator  # Options: azure, gcp, simulator, tdx
  # No config needed for any issuer type

# Validator configuration
validator:
  type: simulator  # Options: azure, gcp, simulator, tdx
