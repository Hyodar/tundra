name: setup
description: >-
  uv, Python 3.12 and the locked environment, for every job of ci.yml; optionally the mkosi
  build host, QEMU with OVMF and /dev/kvm, and the doctor checks.

inputs:
  host:
    description: >-
      none (the unit suite), build (the Debian keyring the mkosi tools tree needs and the
      unprivileged user namespaces Ubuntu 24.04's AppArmor withholds) or boot (build, plus
      QEMU, OVMF and a /dev/kvm the runner user opens).
    default: none
  doctor:
    description: The `tundravm doctor --for` checks to run after the sync, space-separated.
    default: ""

  packages:
    description: >-
      The Debian package cache to restore: attested (examples/attested-node's trees),
      fixture (tests/fixtures/native-tree's) or none. The key names the mkosi version and
      a hash of those trees, which hold every snapshot. ~/.cache/tundravm/packages holds
      only the packages mkosi downloaded, apt still verifies each one, and no built tree
      or tools tree is cached. Save with .github/actions/save-packages.
    default: none

outputs:
  packages-key:
    description: The key the package cache was looked up under; empty when it is off.
    value: ${{ steps.packages.outputs.key }}
  packages-hit:
    description: true when that exact key was restored, so the cache is complete.
    value: ${{ steps.restore.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.3

    - name: Set up Python
      shell: bash
      run: uv python install 3.12

    - name: Prepare the build host
      # mkosi comes with tundravm (uv sync) and builds in an unprivileged user namespace.
      if: inputs.host == 'build' || inputs.host == 'boot'
      shell: bash
      env:
        QEMU: ${{ inputs.host == 'boot' && 'qemu-system-x86 ovmf' || '' }}
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq debian-archive-keyring $QEMU
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

    - name: Let the runner user open /dev/kvm
      if: inputs.host == 'boot'
      shell: bash
      run: |
        qemu-system-x86_64 --version
        ls /usr/share/OVMF
        if [ -e /dev/kvm ]; then
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
        else
          echo "no /dev/kvm: the boots run on TCG"
        fi

    - name: Sync dependencies
      shell: bash
      run: uv sync

    - name: Key the package cache
      id: packages
      shell: bash
      env:
        GROUP: ${{ github.event_name == 'schedule' && 'none' || inputs.packages }}
        TREES: ${{ inputs.packages == 'attested' && hashFiles('examples/attested-node/mkosi/**', 'tests/integration/test_mkosi_smoke.py') || hashFiles('tests/fixtures/native-tree/tree-*/**') }}
        MKOSI: ${{ hashFiles('uv.lock') }}
      run: |
        if [ "$GROUP" = none ]; then
          echo "key=" >> "$GITHUB_OUTPUT"
        else
          echo "key=pkgs-$GROUP-$MKOSI-$TREES" >> "$GITHUB_OUTPUT"
        fi

    - name: Restore the package cache
      id: restore
      if: steps.packages.outputs.key != ''
      uses: actions/cache/restore@v4
      with:
        path: ~/.cache/tundravm/packages
        key: ${{ steps.packages.outputs.key }}
        restore-keys: |
          ${{ steps.packages.outputs.key }}-
          pkgs-${{ inputs.packages }}-

    - name: mkosi and the host
      if: inputs.doctor != ''
      shell: bash
      env:
        CHECKS: ${{ inputs.doctor }}
      run: |
        uv run mkosi --version
        for check in $CHECKS; do
          uv run tundravm doctor --for "$check"
        done
