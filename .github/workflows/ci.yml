# test is the unit suite alone; templates and boot bake the Image templates for real, and
# the fixture jobs lock and build tests/fixtures/native-tree/recipe.py, whose sources are a
# public Go program (a Git source) asking for a newer Go than Debian's and
# tests/fixtures/rust-probe (a Local source, pinned by its content digest) pinning a newer
# Rust: the runner's go fetches the one toolchain and its rustup installs the other. A
# production build is a locked build, so each build root is locked first (`git ls-remote`
# over the runner's network for the Git sources).
# Every job sets up through .github/actions/setup. Every image implies the evidence
# service, which builds from tools/ of this checkout (a Local source), so no job needs
# access to another repository.
name: ci

on:
  push:
    branches:
      - "**"
  pull_request:

# A push already runs every branch of this repository, so a pull request from one would run
# the same commit twice; each job skips that case and runs pull requests from forks only.

concurrency:
  # A newer push to the same branch (or pull request) cancels the run it supersedes.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Lint, format, types and the unit suite: a fake mkosi and fake checkouts, no sudo, no
    # build host, no network resolution (tests/conftest.py); then the Go tests of tools/.
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up
        uses: ./.github/actions/setup

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check src tests examples

      - name: Typecheck
        run: uv run mypy .

      - name: Unit tests
        run: uv run pytest -m "not integration"

      - name: Set up Go for the tools
        uses: actions/setup-go@v6
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: tools/go.sum

      - name: Go tests of the tools
        # tools/ is its own module, so its packages are ./... from there (go test ./tools/...
        # from the root has no module to resolve them in).
        working-directory: tools
        run: go test ./...

      - name: Check the attested node image and its committed tree
        # The example ships no lockfile, so source-unpinned warnings are expected; errors
        # and tree drift fail the step.
        run: uv run tundravm check examples/attested-node/image.py --tree examples/attested-node/mkosi

  templates:
    # Real mkosi builds on the runner: the smoke recipe (no source builds) and the service
    # and cloud templates, whose evidence service builds from tools/ (see the header).
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up the build host
        uses: ./.github/actions/setup
        with:
          host: build
          doctor: build

      - name: Bake the smoke recipe and the templates
        run: >-
          uv run pytest tests/integration/test_mkosi_smoke.py
          tests/integration/test_templates_bake.py -m integration -v -rsP

  boot:
    # Bakes the minimal and service templates and boots them under QEMU with OVMF (KVM when
    # the runner exposes /dev/kvm, TCG otherwise; no TDX here): payload.efi through -kernel,
    # and the service template's qemu.raw as a disk OVMF boots through its ESP. The
    # templates are Image files whose evidence service builds from tools/ (see the header).
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    timeout-minutes: 105
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up the build host, QEMU and OVMF
        uses: ./.github/actions/setup
        with:
          host: boot
          doctor: build run

      - name: Bake and boot the templates
        env:
          TUNDRAVM_BOOT_REQUIRED: "1"
          TUNDRAVM_BOOT_TIMEOUT: "1500"
          TUNDRAVM_BOOT_LOGS: ${{ runner.temp }}/boot-logs
        run: uv run pytest tests/integration/test_templates_boot.py -m boot -v -rsP

      - name: Upload console logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: boot-console-logs
          path: ${{ runner.temp }}/boot-logs
          if-no-files-found: ignore

  fixture-boot:
    # Gate 1, 3 and 5 evidence: the fixture recipe (initramfs root, a Go build from a Git
    # source and a Rust one from a Local directory) built into build directories, its
    # production profile and its dev one, each verified against its manifest, which names the
    # Go toolchain the Go source's go.mod asks for, the Rust one the crate's
    # rust-toolchain.toml pins and the crate's content digest. The production build is
    # booted under QEMU with OVMF both ways
    # (payload.efi through -kernel, qemu.raw through its ESP) by the harness: no TDX here,
    # so it must be fail-closed (tdx-evidence.service refuses, web.service never starts,
    # the boot probe still prints). The dev build runs as an instance with
    # `tundravm run --mode simulated --probe` (KVM when the runner has it, TCG otherwise),
    # where the gate records simulated and the boot probe its declarations compile in must
    # pass every check (the observability exporters' among them), until the host fetches the
    # fixture's page through the forward and the in-guest sink has printed a journal upload
    # and a remote-write batch, each carried through it as the proxy. Then `attest` (simulated)
    # and `secrets deliver` speak plan 6.3's protocol to its attested endpoint.
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    timeout-minutes: 120
    env:
      TUNDRAVM_BACKEND: local
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Put the build root under the runner's temp
        run: echo "TUNDRAVM_BUILD=$RUNNER_TEMP/fixture" >> "$GITHUB_ENV"

      - name: Set up the build host, QEMU and OVMF
        uses: ./.github/actions/setup
        with:
          host: boot
          doctor: build run

      - name: Lock and build the fixture's production and dev profiles
        run: |
          uv run tundravm lock tests/fixtures/native-tree/recipe.py
          uv run tundravm build tests/fixtures/native-tree/recipe.py --profile default
          uv run tundravm build tests/fixtures/native-tree/recipe.py --profile dev
          ls -lL "$TUNDRAVM_BUILD/fixture/latest-production/" "$TUNDRAVM_BUILD/fixture/latest-development/"

      - name: Verify the build directories and show them
        run: |
          uv run tundravm verify latest
          uv run tundravm verify latest-development
          uv run tundravm show latest
          uv run tundravm show latest | grep -E '^  git-codereview +git +\S+ +\S+ +go1\.26\.0 '
          uv run tundravm show latest | grep -E '^  rust-probe +local +- +[0-9a-f]{12} +1\.91\.0 '
          uv run tundravm show latest --json | jq -e '.manifest.sources[]
            | select(.name == "git-codereview") | .go_toolchain.sum | startswith("h1:")'
          uv run tundravm show latest --json | jq -e '.manifest.sources[]
            | select(.name == "rust-probe") | .rust_toolchain.rustc | startswith("rustc 1.91.0 ")'
          uv run tundravm show latest --measurements
          uv run tundravm show --diff latest latest-development
          uv run tundravm show latest-development |
            grep -E '^    observability:egress +the output chain accepts 127\.0\.0\.1:19582/tcp '

      - name: Boot the production build both ways, fail-closed
        env:
          TUNDRAVM_BOOT_REQUIRED: "1"
          TUNDRAVM_BOOT_TIMEOUT: "1500"
          TUNDRAVM_BOOT_LOGS: ${{ runner.temp }}/boot-logs
          TUNDRAVM_FIXTURE_BUILD: ${{ runner.temp }}/fixture/fixture/latest-production
        run: uv run pytest tests/integration/test_fixture_boot.py -m boot -v -rsP

      - name: Run the dev build as an instance, probe it and fetch its page
        run: |
          uv run tundravm show latest-development
          uv run tundravm dev tests/fixtures/native-tree/recipe.py --no-follow
          jq -e '.ok' .tundravm/instances/fixture-1/probe.json
          receipt=.tundravm/instances/fixture-1/instance.json
          port=$(jq -r '.ports["8080"]' "$receipt")
          console=.tundravm/instances/fixture-1/console.log
          for attempt in $(seq 1 150); do
            if curl -fsS "http://127.0.0.1:$port/" | grep -q '<h1>fixture</h1>' &&
              grep -qE 'sink: journal batch [0-9]+ [1-9][0-9]* bytes' "$console" &&
              grep -qE 'sink: remote-write batch [0-9]+ [1-9][0-9]* bytes' "$console"; then
              echo "page served on :$port and both sinks delivered after $attempt attempts"
              break
            fi
            sleep 10
          done
          uv run tundravm run status fixture-1
          uv run tundravm run mode fixture-1
          grep -F 'tdx-evidence: no TDX quote path; development profile, running simulated' \
            "$console"
          grep -m 2 -E 'sink: journal batch [0-9]+ [1-9][0-9]* bytes' "$console"
          grep -m 2 -E 'sink: remote-write batch [0-9]+ [1-9][0-9]* bytes' "$console"
          grep -F 'sink: proxy carries 127.0.0.2:19580' "$console"
          grep -F 'sink: proxy carries 127.0.0.2:19581' "$console"
          grep -E 'tundravm-instance-key: pub 0[23][0-9a-f]{64}' "$console"
          jq -e '.results[] | select(.check == "key:instance") | .verdict == "ok"' \
            .tundravm/instances/fixture-1/probe.json
          curl -fsS "http://127.0.0.1:$port/" | grep -q '<h1>fixture</h1>'

      - name: Attest the dev instance and deliver a secret over its attested endpoint
        # Plan 6.3 under QEMU: the simulator issuer's quote binds the nonce, the endpoint's
        # TLS key, the SSH host keys and the instance key; deliver verifies on its own session.
        run: |
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/operator"
          policy="$TUNDRAVM_BUILD/fixture/latest-development/measurements.json"
          uv run tundravm attest fixture-1 --policy "$policy" --identity "$RUNNER_TEMP/operator"
          jq -e '.attested.verdict == "simulated"' .tundravm/instances/fixture-1/instance.json
          test -s .tundravm/instances/fixture-1/known_hosts
          printf 'fixture-token\n' > "$RUNNER_TEMP/greeting-token"
          uv run tundravm secrets deliver fixture-1 --policy "$policy" \
            "greeting-token=@$RUNNER_TEMP/greeting-token"
          for attempt in $(seq 1 30); do
            grep -qF 'name=greeting-token' .tundravm/instances/fixture-1/console.log && break
            sleep 2
          done
          grep -F 'name=greeting-token' .tundravm/instances/fixture-1/console.log

      - name: Follow a second dev instance through dev and stop it with Ctrl-C
        run: |
          setsid .venv/bin/tundravm dev tests/fixtures/native-tree/recipe.py \
            > "$RUNNER_TEMP/dev-follow.txt" 2>&1 &
          pid=$!
          for attempt in $(seq 1 180); do
            test -f .tundravm/instances/fixture-2/probe.json && break
            sleep 10
          done
          sleep 15
          kill -INT -- "-$pid"
          wait "$pid" && status=0 || status=$?
          cat "$RUNNER_TEMP/dev-follow.txt"
          echo "dev exited $status"
          test "$status" -eq 0
          grep -F 'reusing ' "$RUNNER_TEMP/dev-follow.txt"
          grep -F 'stopped fixture-2' "$RUNNER_TEMP/dev-follow.txt"
          jq -e '.state == "stopped"' .tundravm/instances/fixture-2/instance.json

      - name: Stop the instance
        if: always()
        run: |
          uv run tundravm run logs fixture-1 > "$RUNNER_TEMP/boot-logs-run.txt" || true
          uv run tundravm run stop fixture-1 || true
          mkdir -p "$RUNNER_TEMP/boot-logs"
          mv "$RUNNER_TEMP/boot-logs-run.txt" "$RUNNER_TEMP/boot-logs/run-fixture-1.console.log" || true
          cp -r .tundravm/instances "$RUNNER_TEMP/boot-logs/instances" || true

      - name: Upload console logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fixture-console-logs
          path: ${{ runner.temp }}/boot-logs
          if-no-files-found: ignore

  verity:
    # Gate 1 evidence: the fixture recipe with Mkosi(root="verity") (recipe.py's
    # verity_recipe, picked with --attr) built through tundravm, its qemu.raw booted under
    # QEMU through the ESP, and the root asserted to be erofs on dm-verity under a volatile
    # overlay (the fixture's boot-probe task prints it to the console; it is a boot task,
    # which the execution gate does not hold back, so the production build proves it while
    # its services stay fail-closed).
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    timeout-minutes: 90
    env:
      TUNDRAVM_BACKEND: local
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Put the build root under the runner's temp
        run: echo "TUNDRAVM_BUILD=$RUNNER_TEMP/verity" >> "$GITHUB_ENV"

      - name: Set up the build host, QEMU and OVMF
        uses: ./.github/actions/setup
        with:
          host: boot
          doctor: build run

      - name: Lock and build the verity fixture
        run: |
          uv run tundravm lock tests/fixtures/native-tree/recipe.py --attr verity_recipe
          uv run tundravm build tests/fixtures/native-tree/recipe.py --attr verity_recipe \
            --profile default
          uv run tundravm verify latest
          ls -lL "$TUNDRAVM_BUILD/fixture/latest-production/"

      - name: Boot qemu.raw through its ESP
        env:
          TUNDRAVM_BOOT_REQUIRED: "1"
          TUNDRAVM_BOOT_TIMEOUT: "1500"
          TUNDRAVM_BOOT_LOGS: ${{ runner.temp }}/boot-logs
          TUNDRAVM_VERITY_BUILD: ${{ runner.temp }}/verity/fixture/latest-production
        run: uv run pytest tests/integration/test_verity_boot.py -m boot -v -rsP

      - name: Upload console logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verity-console-logs
          path: ${{ runner.temp }}/boot-logs
          if-no-files-found: ignore

  verity-cloud:
    # The verity layout's azure and gcp profiles: both converters must keep the root and
    # hash partitions byte for byte (tests/integration/test_verity_cloud.py).
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    timeout-minutes: 90
    env:
      TUNDRAVM_BACKEND: local
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up the build host
        uses: ./.github/actions/setup
        with:
          host: build

      - name: Lock and build the verity fixture's cloud profiles
        run: |
          mkdir -p "$RUNNER_TEMP/verity-cloud"
          for profile in azure gcp; do
            TUNDRAVM_BUILD="$RUNNER_TEMP/verity-$profile" uv run tundravm lock \
              tests/fixtures/native-tree/recipe.py --attr verity_recipe
            TUNDRAVM_BUILD="$RUNNER_TEMP/verity-$profile" uv run tundravm build \
              tests/fixtures/native-tree/recipe.py --attr verity_recipe --profile "$profile"
            TUNDRAVM_BUILD="$RUNNER_TEMP/verity-$profile" uv run tundravm verify latest
            ln -s "$(readlink -f "$RUNNER_TEMP/verity-$profile/fixture/latest-production")" \
              "$RUNNER_TEMP/verity-cloud/$profile"
          done
          ls -lL "$RUNNER_TEMP/verity-cloud/azure/" "$RUNNER_TEMP/verity-cloud/gcp/"

      - name: The converters keep the verity partitions
        env:
          TUNDRAVM_VERITY_CLOUD_BUILD: ${{ runner.temp }}/verity-cloud
        run: uv run pytest tests/integration/test_verity_cloud.py -v -rs

  reproduce:
    # Gate 1 and 5 evidence: the fixture's azure and gcp profiles each built twice through
    # tundravm, the second time in an independent workspace (`build --reproduce`: its own
    # sources, the Local crate copied again, mkosi state and tree); every artifact must
    # match, which exits 1 otherwise. The verity layout's azure profile is built twice too:
    # its azure.vhd carries the erofs root and verity hash partitions, which verity-cloud
    # checks are kept byte for byte but builds once.
    # The comparison is recorded in each build directory's observations.json, and each
    # build directory is then verified against its manifest.
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    timeout-minutes: 120
    env:
      TUNDRAVM_BACKEND: local
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Put the build root under the runner's temp
        run: echo "TUNDRAVM_BUILD=$RUNNER_TEMP/reproduce" >> "$GITHUB_ENV"

      - name: Set up the build host
        uses: ./.github/actions/setup
        with:
          host: build
          doctor: build

      - name: Lock, then build each cloud profile twice and compare
        run: |
          uv run tundravm lock tests/fixtures/native-tree/recipe.py
          for profile in azure gcp; do
            uv run tundravm build tests/fixtures/native-tree/recipe.py --profile "$profile" \
              --reproduce
            uv run tundravm verify latest
          done

      - name: Lock, then build the verity layout's azure profile twice and compare
        run: |
          uv run tundravm lock tests/fixtures/native-tree/recipe.py --attr verity_recipe
          uv run tundravm build tests/fixtures/native-tree/recipe.py --attr verity_recipe \
            --profile azure --reproduce
          uv run tundravm verify latest

      - name: Collect the manifests and the comparisons
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/reproduce-records"
          for build in "$TUNDRAVM_BUILD"/fixture/production/*/; do
            id=$(basename "$build")
            cp "$build/manifest.json" "$RUNNER_TEMP/reproduce-records/$id.manifest.json"
            cp "$build/observations.json" "$RUNNER_TEMP/reproduce-records/$id.observations.json"
            jq '.reproduction' "$build/observations.json"
          done

      - name: Upload the records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reproduce-records
          path: ${{ runner.temp }}/reproduce-records
          if-no-files-found: ignore
