name: ci

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install mkosi
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap debian-archive-keyring
          pipx install git+https://github.com/systemd/mkosi.git
          mkosi --version

      - name: Sync dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Typecheck
        run: uv run mypy .

      - name: Tests
        run: uv run pytest

      - name: Lint example recipes
        # The surge recipe tracks upstream branches on purpose and ships no lockfile,
        # so source-unpinned warnings are expected; errors still fail the step.
        run: uv run tundravm check examples/surge-tdx-prover/image.py --all-profiles

      - name: Committed mkosi tree is up to date
        run: uv run tundravm compile examples/surge-tdx-prover/image.py --out examples/surge-tdx-prover/mkosi --check
