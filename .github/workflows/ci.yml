name: ci

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Prepare the build host
        # mkosi comes with tundravm (uv sync); the host needs the Debian keyring for the
        # tools tree and the unprivileged user namespaces Ubuntu 24.04's AppArmor withholds.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq debian-archive-keyring
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Sync dependencies
        run: uv sync

      - name: mkosi and the host
        run: |
          uv run mkosi --version
          uv run tundravm doctor --for build

      - name: Lint
        run: uv run ruff check .

      - name: Typecheck
        run: uv run mypy .

      - name: Tests
        run: uv run pytest

      - name: Lint example recipes
        # The surge recipe tracks upstream branches on purpose and ships no lockfile,
        # so source-unpinned warnings are expected; errors still fail the step.
        run: uv run tundravm lint examples/surge-tdx-prover/image.py

      - name: Committed mkosi tree is up to date
        run: uv run tundravm compile examples/surge-tdx-prover/image.py --tree examples/surge-tdx-prover/mkosi --check

  boot:
    # Bakes the minimal and service templates and boots them under QEMU with OVMF (KVM when
    # the runner exposes /dev/kvm, TCG otherwise; no TDX here): payload.efi through -kernel,
    # and the service template's qemu.raw as a disk OVMF boots through its ESP. The
    # templates are Image files whose evidence service builds tundra-tools from its source
    # repository: the bake fetches it, so this job needs read access to that repository.
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Prepare the build host, QEMU and OVMF
        # mkosi comes with tundravm (uv sync) and builds in an unprivileged user namespace.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq debian-archive-keyring qemu-system-x86 ovmf
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          qemu-system-x86_64 --version
          ls /usr/share/OVMF

      - name: Let the runner user open /dev/kvm
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            ls -l /dev/kvm
          else
            echo "no /dev/kvm: the boots run on TCG"
          fi

      - name: Sync dependencies
        run: uv sync

      - name: mkosi and the host
        run: |
          uv run mkosi --version
          uv run tundravm doctor --for build
          uv run tundravm doctor --for run

      - name: Bake and boot the templates
        env:
          TUNDRAVM_BOOT_REQUIRED: "1"
          TUNDRAVM_BOOT_TIMEOUT: "1500"
          TUNDRAVM_BOOT_LOGS: ${{ runner.temp }}/boot-logs
        run: uv run pytest tests/integration/test_templates_boot.py -m boot -v -rs -rP

      - name: Upload console logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-console-logs
          path: ${{ runner.temp }}/boot-logs
          if-no-files-found: ignore

  fixture-boot:
    # Gate 1 evidence: the fixture recipe (initramfs root, no source builds) baked through
    # tundravm and booted under QEMU with OVMF both ways: payload.efi through -kernel, and
    # qemu.raw as a virtio disk OVMF boots through its ESP; each serves the fixture's page
    # to the host and boots the UKI's own command line.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Prepare the build host, QEMU and OVMF
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq debian-archive-keyring qemu-system-x86 ovmf
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Let the runner user open /dev/kvm
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          else
            echo "no /dev/kvm: the boot runs on TCG"
          fi

      - name: Sync dependencies
        run: uv sync

      - name: mkosi and the host
        run: |
          uv run mkosi --version
          uv run tundravm doctor --for build
          uv run tundravm doctor --for run

      - name: Bake the fixture
        run: |
          uv run tundravm bake tests/fixtures/native-tree/recipe.py \
            --variant default --backend local --build "$RUNNER_TEMP/fixture"
          ls -l "$RUNNER_TEMP/fixture/default/output"

      - name: Boot payload.efi through -kernel and qemu.raw through its ESP
        env:
          TUNDRAVM_BOOT_REQUIRED: "1"
          TUNDRAVM_BOOT_TIMEOUT: "1500"
          TUNDRAVM_BOOT_LOGS: ${{ runner.temp }}/boot-logs
          TUNDRAVM_FIXTURE_BUILD: ${{ runner.temp }}/fixture
        run: uv run pytest tests/integration/test_fixture_boot.py -m boot -v -rs -rP

      - name: Upload console logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixture-console-logs
          path: ${{ runner.temp }}/boot-logs
          if-no-files-found: ignore

  verity:
    # Gate 1 evidence: the fixture recipe with Mkosi(root="verity") (recipe.py's
    # verity_recipe, picked with --attr) baked through tundravm, its qemu.raw booted under
    # QEMU through the ESP, and the root asserted to be erofs on dm-verity under a volatile
    # overlay (the fixture's boot-probe task prints it to the console).
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Prepare the build host, QEMU and OVMF
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq debian-archive-keyring qemu-system-x86 ovmf
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Let the runner user open /dev/kvm
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          else
            echo "no /dev/kvm: the boot runs on TCG"
          fi

      - name: Sync dependencies
        run: uv sync

      - name: mkosi and the host
        run: |
          uv run mkosi --version
          uv run tundravm doctor --for build
          uv run tundravm doctor --for run

      - name: Bake the verity fixture
        run: |
          uv run tundravm bake tests/fixtures/native-tree/recipe.py --attr verity_recipe \
            --variant default --backend local --build "$RUNNER_TEMP/verity"
          ls -l "$RUNNER_TEMP/verity/default/output"

      - name: Boot qemu.raw through its ESP
        env:
          TUNDRAVM_BOOT_REQUIRED: "1"
          TUNDRAVM_BOOT_TIMEOUT: "1500"
          TUNDRAVM_BOOT_LOGS: ${{ runner.temp }}/boot-logs
          TUNDRAVM_VERITY_BUILD: ${{ runner.temp }}/verity
        run: uv run pytest tests/integration/test_verity_boot.py -m boot -v -rs -rP

      - name: Upload console logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verity-console-logs
          path: ${{ runner.temp }}/boot-logs
          if-no-files-found: ignore

  verity-cloud:
    # The verity layout's azure and gcp variants: both converters must keep the root and
    # hash partitions byte for byte (tests/integration/test_verity_cloud.py).
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Prepare the build host
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq debian-archive-keyring
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Sync dependencies
        run: uv sync

      - name: Bake the verity fixture's cloud variants
        run: |
          uv run tundravm bake tests/fixtures/native-tree/recipe.py --attr verity_recipe \
            --variant azure --variant gcp --backend local --build "$RUNNER_TEMP/verity"
          ls -l "$RUNNER_TEMP/verity/azure/output" "$RUNNER_TEMP/verity/gcp/output"

      - name: The converters keep the verity partitions
        env:
          TUNDRAVM_VERITY_CLOUD_BUILD: ${{ runner.temp }}/verity
        run: uv run pytest tests/integration/test_verity_cloud.py -v -rs

  reproduce:
    # Gate 1 evidence: the fixture recipe built twice, in two independent build directories,
    # through tundravm. The azure and gcp variants each build the payload, the QEMU disk and
    # their wrapper (--dependency=azure, --dependency=gcp); every artifact must match.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Prepare the build host
        # Same as the boot job without QEMU: mkosi builds in an unprivileged user namespace.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq debian-archive-keyring
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Sync dependencies
        run: uv sync

      - name: mkosi and the host
        run: |
          uv run mkosi --version
          uv run tundravm doctor --for build

      - name: Build the fixture twice
        run: |
          for build in "$RUNNER_TEMP/build-a" "$RUNNER_TEMP/build-b"; do
            uv run tundravm bake tests/fixtures/native-tree/recipe.py \
              --variant azure --variant gcp --backend local --build "$build"
          done

      - name: Compare the digests
        run: |
          mkdir -p "$RUNNER_TEMP/reproduce-digests"
          for build in build-a build-b; do
            (
              cd "$RUNNER_TEMP/$build"
              sha256sum azure/output/payload.efi azure/output/qemu.raw azure/output/azure.vhd \
                gcp/output/payload.efi gcp/output/qemu.raw gcp/output/gcp.tar.gz
            ) >"$RUNNER_TEMP/reproduce-digests/$build.sha256"
            echo "== $build"
            cat "$RUNNER_TEMP/reproduce-digests/$build.sha256"
          done
          cd "$RUNNER_TEMP/build-b"
          sha256sum --check "$RUNNER_TEMP/reproduce-digests/build-a.sha256"

      - name: Upload the digests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reproduce-digests
          path: ${{ runner.temp }}/reproduce-digests
          if-no-files-found: ignore
