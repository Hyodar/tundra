name: ci

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install mkosi
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap debian-archive-keyring python3-pefile
          pipx install git+https://github.com/systemd/mkosi.git
          mkosi --version

      - name: Sync dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Typecheck
        run: uv run mypy .

      - name: Tests
        run: uv run pytest

      - name: Lint example recipes
        # The surge recipe tracks upstream branches on purpose and ships no lockfile,
        # so source-unpinned warnings are expected; errors still fail the step.
        run: uv run tundravm lint examples/surge-tdx-prover/image.py

      - name: Committed mkosi tree is up to date
        run: uv run tundravm compile examples/surge-tdx-prover/image.py --tree examples/surge-tdx-prover/mkosi --check

  boot:
    # Bakes the minimal and service templates into UKIs and boots them under QEMU with
    # OVMF (KVM when the runner exposes /dev/kvm, TCG otherwise); no TDX here.
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install mkosi, QEMU and OVMF
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap debian-archive-keyring python3-pefile \
            qemu-system-x86 ovmf
          pipx install git+https://github.com/systemd/mkosi.git
          mkosi --version
          qemu-system-x86_64 --version
          ls /usr/share/OVMF

      - name: Let the runner user open /dev/kvm
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            ls -l /dev/kvm
          else
            echo "no /dev/kvm: the boots run on TCG"
          fi

      - name: Sync dependencies
        run: uv sync

      - name: Bake and boot the templates
        env:
          TUNDRAVM_BOOT_REQUIRED: "1"
          TUNDRAVM_BOOT_TIMEOUT: "1500"
          TUNDRAVM_BOOT_LOGS: ${{ runner.temp }}/boot-logs
        run: uv run pytest tests/integration/test_templates_boot.py -m boot -v -rs

      - name: Upload console logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: boot-console-logs
          path: ${{ runner.temp }}/boot-logs
          if-no-files-found: ignore
