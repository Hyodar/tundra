# test is the unit suite alone; stages and boot bake the attested node's stage 1 for real, and
# the fixture jobs lock and build tests/fixtures/native-tree/fixture.py, whose sources are a
# public Go program (a Git source) asking for a newer Go than Debian's and
# tests/fixtures/rust-probe (a Local source, pinned by its content digest) pinning a newer
# Rust: the runner's go fetches the one toolchain and its rustup installs the other. A
# production build is a locked build, so each build root is locked first (`git ls-remote`
# over the runner's network for the Git sources).
# Every job sets up through .github/actions/setup. Every image implies the evidence
# service, which builds from tools/ of this checkout (a Local source), so no job needs
# access to another repository.
name: ci

on:
  push:
    branches:
      - "**"
  pull_request:

# A push already runs every branch of this repository, so a pull request from one would run
# the same commit twice; each job skips that case and runs pull requests from forks only.

concurrency:
  # A newer push to the same branch (or pull request) cancels the run it supersedes.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Lint, format, types and the unit suite: a fake mkosi and fake checkouts, no sudo, no
    # build host, no network resolution (tests/conftest.py); then the Go tests of tools/.
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up
        uses: ./.github/actions/setup

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check src tests examples

      - name: Typecheck
        run: uv run mypy .

      - name: Unit tests
        run: uv run pytest -m "not integration"

      - name: Set up Go for the tools
        uses: actions/setup-go@v6
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: tools/go.sum

      - name: Go tests of the tools
        # tools/ is its own module, so its packages are ./... from there (go test ./tools/...
        # from the root has no module to resolve them in).
        working-directory: tools
        run: go test ./...

      - name: Check the attested node image and its committed tree
        # The example ships no lockfile, so source-unpinned warnings are expected; errors
        # and tree drift fail the step.
        run: uv run tundravm check examples/attested-node/image.py --tree examples/attested-node/mkosi

  stages:
    # Real mkosi builds on the runner: the smoke recipe (no source builds) and the attested
    # node's stage 1, whose evidence service builds from tools/ (see the header), production
    # and with every cloud target. Stages 2 to 6 build Nethermind from Git with .NET, over
    # the ten minutes a stage gets here (the fixture's two profiles, two small Go programs
    # and a Rust one, take four), so the signer they add is vetted, tested and built alone.
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up the build host
        uses: ./.github/actions/setup
        with:
          host: build
          doctor: build

      - name: Bake the smoke recipe and stage 1 (stages 2 to 6 build Nethermind with .NET, too slow)
        run: >-
          uv run pytest tests/integration/test_mkosi_smoke.py
          tests/integration/test_stages_bake.py -m integration -v -rsP

      - name: Set up Go for the signer
        uses: actions/setup-go@v6
        with:
          go-version-file: examples/attested-node/signer/go.mod
          cache-dependency-path: examples/attested-node/signer/go.sum

      - name: Vet, test and build the signer stages 4 to 6 add (their images are not baked)
        working-directory: examples/attested-node/signer
        run: |
          go vet ./...
          go test ./...
          go build -o /dev/null ./...

  boot:
    # Bakes the attested node's stage 1 as its dev profile and boots it under QEMU with OVMF
    # (KVM when the runner exposes /dev/kvm, TCG otherwise; no TDX here): payload.efi through
    # -kernel and qemu.raw as a disk OVMF boots through its ESP, each until its boot probe
    # passes. Its evidence service builds from tools/ (see the header).
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    timeout-minutes: 105
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up the build host, QEMU and OVMF
        uses: ./.github/actions/setup
        with:
          host: boot
          doctor: build run

      - name: Bake stage 1's dev profile and boot it both ways
        env:
          TUNDRAVM_BOOT_REQUIRED: "1"
          TUNDRAVM_BOOT_TIMEOUT: "1500"
          TUNDRAVM_BOOT_LOGS: ${{ runner.temp }}/boot-logs
        run: uv run pytest tests/integration/test_stages_boot.py -m boot -v -rsP

      - name: Upload console logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: boot-console-logs
          path: ${{ runner.temp }}/boot-logs
          if-no-files-found: ignore

  fixture-boot:
    # Gate 1, 3 and 5 evidence: the fixture image (initramfs root, a Go build from a Git
    # source and a Rust one from a Local directory) built into build directories, its
    # production profile and its dev one, each verified against its manifest, which names the
    # Go toolchain the Go source's go.mod asks for, the Rust one the crate's
    # rust-toolchain.toml pins and the crate's content digest. The production build is
    # booted under QEMU with OVMF both ways
    # (payload.efi through -kernel, qemu.raw through its ESP) by the harness: no TDX here,
    # so it must be fail-closed (tdx-evidence.service refuses, web.service never starts).
    # The dev build runs as an instance with `tundravm dev --no-follow` (KVM when the runner
    # has it, TCG otherwise), where the gate records simulated and the platform probe its
    # declarations compile in must pass every check (the root tmpfs and its cap, the
    # observability exporters' among them), the Go and the Rust program print their lines,
    # until the host fetches the fixture's page through the forward and the in-guest sink has
    # printed a journal upload and a remote-write batch, each carried through it as the
    # proxy. Then `attest` (simulated) and `secrets deliver` speak plan 6.3's protocol to its
    # attested endpoint.
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    timeout-minutes: 120
    env:
      TUNDRAVM_BACKEND: local
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Put the build root under the runner's temp
        run: echo "TUNDRAVM_BUILD=$RUNNER_TEMP/fixture" >> "$GITHUB_ENV"

      - name: Set up the build host, QEMU and OVMF
        uses: ./.github/actions/setup
        with:
          host: boot
          doctor: build run

      - name: Lock and build the fixture's production and dev profiles
        run: |
          uv run tundravm lock tests/fixtures/native-tree/fixture.py
          uv run tundravm build tests/fixtures/native-tree/fixture.py
          uv run tundravm build tests/fixtures/native-tree/fixture.py --dev
          ls -lL "$TUNDRAVM_BUILD/fixture/latest-production/" "$TUNDRAVM_BUILD/fixture/latest-development/"

      - name: Verify the build directories and show them
        run: |
          uv run tundravm verify latest
          uv run tundravm verify latest-development
          uv run tundravm show latest
          uv run tundravm show latest | grep -E '^  git-codereview +git +\S+ +\S+ +go1\.26\.0 '
          uv run tundravm show latest | grep -E '^  rust-probe +local +- +[0-9a-f]{12} +1\.91\.0 '
          uv run tundravm show latest --json | jq -e '.manifest.sources[]
            | select(.name == "git-codereview") | .go_toolchain.sum | startswith("h1:")'
          uv run tundravm show latest --json | jq -e '.manifest.sources[]
            | select(.name == "rust-probe") | .rust_toolchain.rustc | startswith("rustc 1.91.0 ")'
          uv run tundravm show latest --measurements
          uv run tundravm show --diff latest latest-development
          uv run tundravm show latest-development |
            grep -E '^    observability:egress +the output chain accepts 127\.0\.0\.1:19582/tcp '

      - name: Boot the production build both ways, fail-closed
        env:
          TUNDRAVM_BOOT_REQUIRED: "1"
          TUNDRAVM_BOOT_TIMEOUT: "1500"
          TUNDRAVM_BOOT_LOGS: ${{ runner.temp }}/boot-logs
          TUNDRAVM_FIXTURE_BUILD: ${{ runner.temp }}/fixture/fixture/latest-production
        run: uv run pytest tests/integration/test_fixture_boot.py -m boot -v -rsP

      - name: Run the dev build as an instance, probe it and fetch its page
        run: |
          uv run tundravm show latest-development
          uv run tundravm dev tests/fixtures/native-tree/fixture.py --no-follow
          probe=.tundravm/instances/fixture-1/probe.json
          jq -r '.results[] | "\(.check) \(.verdict) \(.detail)"' "$probe"
          jq -e '.ok' "$probe"
          jq -e '.results[] | select(.check == "rootfs:initramfs")
            | .verdict == "ok" and (.detail | test("size=4194304k"))' "$probe"
          receipt=.tundravm/instances/fixture-1/instance.json
          port=$(jq -r '.ports["8080"]' "$receipt")
          console=.tundravm/instances/fixture-1/console.log
          for attempt in $(seq 1 150); do
            if curl -fsS "http://127.0.0.1:$port/" | grep -q '<h1>fixture</h1>' &&
              grep -qE 'sink: journal batch [0-9]+ [1-9][0-9]* bytes' "$console" &&
              grep -qE 'sink: remote-write batch [0-9]+ [1-9][0-9]* bytes' "$console"; then
              echo "page served on :$port and both sinks delivered after $attempt attempts"
              break
            fi
            sleep 10
          done
          uv run tundravm run status fixture-1
          uv run tundravm run mode fixture-1
          grep -F 'tdx-evidence: no TDX quote path; development profile, running simulated' \
            "$console"
          grep -F 'tdxs-issuer: no TDX quote path; issuing simulated quotes' "$console"
          grep -m 2 -E 'sink: journal batch [0-9]+ [1-9][0-9]* bytes' "$console"
          grep -m 2 -E 'sink: remote-write batch [0-9]+ [1-9][0-9]* bytes' "$console"
          grep -F 'sink: proxy carries 127.0.0.2:19580' "$console"
          grep -F 'sink: proxy carries 127.0.0.2:19581' "$console"
          grep -E 'tundravm-instance-key: pub 0[23][0-9a-f]{64}' "$console"
          grep -F 'Usage: git-codereview <command> [-n] [-v]' "$console"
          grep -F 'built by rustc 1.91.0' "$console"
          jq -e '.results[] | select(.check == "key:instance") | .verdict == "ok"' "$probe"
          curl -fsS "http://127.0.0.1:$port/" | grep -q '<h1>fixture</h1>'

      - name: Fetch the container's page and match its root against the manifest
        # The dev profile's Container runs busybox httpd in a root image built as the
        # mkosi.images/box/ subimage, on a veth the firewall forwards; the probe prints that
        # image's digest from inside the guest, which must be the one the manifest records,
        # and proves its egress, host endpoint, served port and UDP port from the guest. The
        # page comes through the QEMU forward and the firewall's DNAT.
        run: |
          probe=.tundravm/instances/fixture-1/probe.json
          receipt=.tundravm/instances/fixture-1/instance.json
          jq -r '.results[] | select(.check | startswith("container:box")) | "\(.check) \(.verdict) \(.detail)"' "$probe"
          row=$(jq -r '.results[] | select(.check == "container:box") | "\(.check) \(.verdict) \(.detail)"' "$probe")
          want=$(uv run tundravm show latest-development --json | jq -r '.manifest.containers.box.sha256')
          grep -E "^container:box ok active, root sha256:$want, at 169\.254\.[0-9.]+ on its veth$" <<<"$row"
          jq -e '[.results[] | select(.check | startswith("container:box:")) | .verdict == "ok"]
            == [true, true, true, true]' "$probe"
          port=$(jq -r '.ports["8081"]' "$receipt")
          curl -fsS "http://127.0.0.1:$port/" | tee "$RUNNER_TEMP/box.html"
          grep -q '<h1>box</h1>' "$RUNNER_TEMP/box.html"
          window=$(jq -r '.ports["8082"]' "$receipt")
          if curl -fsS -m 5 "http://127.0.0.1:$window/"; then
            echo "the container's maintenance port answered in production"; exit 1
          fi

      - name: Attest the dev instance and deliver a secret over its attested endpoint
        # Plan 6.3 under QEMU: the simulator issuer the dev profile picked at boot binds the
        # nonce, the endpoint's TLS key, the SSH host keys, the instance key and the attested
        # TLS port's certificate key; deliver verifies on its own session. `attest --tls`
        # checks the certificate the port serves against that binding, as the Go client does.
        run: |
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/operator"
          policy="$TUNDRAVM_BUILD/fixture/latest-development/measurements.json"
          receipt=.tundravm/instances/fixture-1/instance.json
          console=.tundravm/instances/fixture-1/console.log
          uv run tundravm attest fixture-1 --policy "$policy" --identity "$RUNNER_TEMP/operator"
          jq -e '.attested.verdict == "simulated"' "$receipt"
          test -s .tundravm/instances/fixture-1/known_hosts
          uv run tundravm attest fixture-1 --policy "$policy" --tls 8443 | tee "$RUNNER_TEMP/attest-tls.txt"
          grep -E '^certificate   :8443  sha256:[0-9a-f]{64}  \(key bound to the quote\)$' "$RUNNER_TEMP/attest-tls.txt"
          grep -E 'tundravm-attested-tls: :8443 sha256:[0-9a-f]{64}' "$console"
          jq -e '.results[] | select(.check == "attested-tls:8443") | .verdict == "ok"' \
            .tundravm/instances/fixture-1/probe.json
          tls=$(jq -r '.ports["8443"]' "$receipt")
          management=$(jq -r '.ports["8745"]' "$receipt")
          (cd tools && go run ./cmd/attested-client --dev --endpoint "127.0.0.1:$management" \
            "https://127.0.0.1:$tls" | tee "$RUNNER_TEMP/attested-client.txt")
          grep -E '^certificate  127.0.0.1:[0-9]+  sha256:[0-9a-f]{64}  \(bound to the quote for :8443\)$' \
            "$RUNNER_TEMP/attested-client.txt"
          grep -F 'verdict: simulated' "$RUNNER_TEMP/attested-client.txt"
          printf 'fixture-token\n' > "$RUNNER_TEMP/greeting-token"
          uv run tundravm secrets deliver fixture-1 --policy "$policy" \
            "greeting-token=@$RUNNER_TEMP/greeting-token"
          for attempt in $(seq 1 30); do
            grep -qF 'name=greeting-token' .tundravm/instances/fixture-1/console.log && break
            sleep 2
          done
          grep -F 'name=greeting-token' .tundravm/instances/fixture-1/console.log

      - name: Log in to the container's sshd with its delivered key
        # ContainerSsh: box's own sshd, run as box in its root, on 10022 through the host's
        # forward. attest pinned the host key the quote binds for box in known_hosts; the
        # key ssh-keyscan sees must be that one. Only box logs in, by key: root and a
        # password are refused. Success first, once each: OpenSSH 10 penalises failures.
        run: |
          policy="$TUNDRAVM_BUILD/fixture/latest-development/measurements.json"
          receipt=.tundravm/instances/fixture-1/instance.json
          known=.tundravm/instances/fixture-1/known_hosts
          probe=.tundravm/instances/fixture-1/probe.json
          console=.tundravm/instances/fixture-1/console.log
          jq -r '.results[] | select(.check == "container-ssh:box") | "\(.check) \(.verdict) \(.detail)"' "$probe"
          jq -e '.results[] | select(.check == "container-ssh:box") | .verdict == "ok"' "$probe"
          grep -E 'tundravm-container-ssh: box SHA256:[A-Za-z0-9+/]{43}' "$console"
          port=$(jq -r '.ports["10022"]' "$receipt")
          pinned=$(grep -F "[127.0.0.1]:$port " "$known" | cut -d ' ' -f 2,3)
          echo "pinned for box: $pinned"
          test -n "$pinned"
          seen=$(ssh-keyscan -p "$port" -t ed25519 127.0.0.1 2>/dev/null | cut -d ' ' -f 2,3)
          echo "box's sshd shows: $seen"
          test "$seen" = "$pinned"
          uv run tundravm secrets deliver fixture-1 --policy "$policy" \
            "box-keys=@$RUNNER_TEMP/operator.pub"
          as() {
            ssh -i "$RUNNER_TEMP/operator" -p "$port" -o IdentitiesOnly=yes -o BatchMode=yes \
              -o UserKnownHostsFile="$known" -o StrictHostKeyChecking=yes "$@"
          }
          as box@127.0.0.1 'true && id -un' | tee "$RUNNER_TEMP/box-ssh.txt"
          grep -Fx box "$RUNNER_TEMP/box-ssh.txt"
          if as root@127.0.0.1 true 2>"$RUNNER_TEMP/box-root.txt"; then
            echo "root logged in to box's sshd"; exit 1
          fi
          cat "$RUNNER_TEMP/box-root.txt"
          grep -F 'Permission denied (publickey)' "$RUNNER_TEMP/box-root.txt"
          if as -o PubkeyAuthentication=no -o PreferredAuthentications=password,keyboard-interactive \
            box@127.0.0.1 true 2>"$RUNNER_TEMP/box-password.txt"; then
            echo "box's sshd let a login in without a key"; exit 1
          fi
          cat "$RUNNER_TEMP/box-password.txt"
          grep -F 'Permission denied (publickey)' "$RUNNER_TEMP/box-password.txt"

      - name: Open a maintenance window on the dev instance
        # Firewall(modes=): the dev profile's SSH answers only in maintenance. `run switch`
        # rides the attested endpoint's bound session and mode-switch extends RTMR3 before
        # the ruleset changes (the simulator replays its log). sshd's banner says whether 22
        # answers without a login attempt, which OpenSSH 10 would count against the source.
        run: |
          probe=.tundravm/instances/fixture-1/probe.json
          port=$(jq -r '.ports["22"]' .tundravm/instances/fixture-1/instance.json)
          jq -r '.results[] | select(.check == "mode:firewall") | "\(.check) \(.verdict) \(.detail)"' "$probe"
          jq -e '.results[] | select(.check == "mode:firewall") | .verdict == "ok"' "$probe"
          if timeout 20 bash -c "exec 3<>/dev/tcp/127.0.0.1/$port && head -c 4 <&3" | grep -q SSH-; then
            echo "port 22 answered in production"; exit 1
          fi
          uv run tundravm run switch fixture-1 maintenance | tee "$RUNNER_TEMP/switch.txt"
          timeout 20 bash -c "exec 3<>/dev/tcp/127.0.0.1/$port && head -c 4 <&3" | grep -q SSH-
          echo "ssh answered in maintenance"
          window=$(jq -r '.ports["8082"]' .tundravm/instances/fixture-1/instance.json)
          curl -fsS -m 10 "http://127.0.0.1:$window/" | grep -q '<h1>box</h1>'
          echo "the container's maintenance port answered in maintenance"
          sleep 2

      - name: Log in as the tenant into its menu, refuse root, close the window from it
        # The dev profile's Login("tenant", owner=True): attest handed it the operator's key
        # instead of root. Against the host key the quote bound (attest's known_hosts), an
        # empty request lists the menu, entries run with typed arguments as the login or
        # through one exact sudoers line, and what the menu does not offer is refused. Root
        # has no key and PermitRootLogin no. Its `switch production` runs mode-switch locally,
        # which drops the session's own flow, so the client sees no answer.
        run: |
          probe=.tundravm/instances/fixture-1/probe.json
          port=$(jq -r '.ports["22"]' .tundravm/instances/fixture-1/instance.json)
          as() {
            user=$1
            shift
            ssh -i "$RUNNER_TEMP/operator" -p "$port" -o IdentitiesOnly=yes -o BatchMode=yes \
              -o ServerAliveInterval=3 -o ServerAliveCountMax=3 \
              -o UserKnownHostsFile=.tundravm/instances/fixture-1/known_hosts \
              -o StrictHostKeyChecking=yes "$user@127.0.0.1" "$@"
          }
          as tenant | tee "$RUNNER_TEMP/menu.txt"
          grep -Fx '  greeting' "$RUNNER_TEMP/menu.txt"
          grep -E '^  logs <lines> +lines 1-1000, as root$' "$RUNNER_TEMP/menu.txt"
          grep -E '^  switch <mode> +mode production\|maintenance, as root$' "$RUNNER_TEMP/menu.txt"
          as tenant greeting | tee "$RUNNER_TEMP/tenant.txt"
          grep -Fx 'hello from the payload' "$RUNNER_TEMP/tenant.txt"
          as tenant web | grep -Fx active
          as tenant logs 20 | tee "$RUNNER_TEMP/logs.txt"
          grep -Fx 'hello from the payload' "$RUNNER_TEMP/logs.txt"
          for bad in 'logs 1001' 'logs 3;id' sh 'switch tdx'; do
            if as tenant "$bad" 2> "$RUNNER_TEMP/refused.txt"; then
              echo "the menu ran '$bad'"; exit 1
            fi
            cat "$RUNNER_TEMP/refused.txt"
            grep -E '^login-menu: ' "$RUNNER_TEMP/refused.txt"
            grep -E '^fix: ssh tenant@HOST' "$RUNNER_TEMP/refused.txt"
          done
          jq -r '.results[] | select(.check == "root" or .check == "login:tenant" or .check == "menu:tenant" or .check == "ssh:root")
            | "\(.check) \(.verdict) \(.detail)"' "$probe"
          jq -e '[.results[] | select(.check == "root" or .check == "login:tenant" or .check == "menu:tenant" or .check == "ssh:root")
            | .verdict == "ok"] == [true, true, true, true]' "$probe"
          # one failed login, under OpenSSH 10's penalty threshold
          if as root true 2> "$RUNNER_TEMP/root.txt"; then
            echo "root logged in"; exit 1
          fi
          grep -F 'Permission denied (publickey)' "$RUNNER_TEMP/root.txt"
          sleep 6
          # ServerAlive ends the client once the switch drops its flow
          as tenant switch production || echo "the session ended with $? once the window closed"

      - name: Read the window the tenant closed and both switches in attest
        # Back in production 22 is refused again, and attest replays both switches, the
        # endpoint's and the tenant's local one, against the quote's RTMR3.
        run: |
          receipt=.tundravm/instances/fixture-1/instance.json
          console=.tundravm/instances/fixture-1/console.log
          policy="$TUNDRAVM_BUILD/fixture/latest-development/measurements.json"
          port=$(jq -r '.ports["22"]' "$receipt")
          if timeout 20 bash -c "exec 3<>/dev/tcp/127.0.0.1/$port && head -c 4 <&3" | grep -q SSH-; then
            echo "port 22 answered after the window closed"; exit 1
          fi
          echo "port 22 refused after the window closed"
          window=$(jq -r '.ports["8082"]' "$receipt")
          if curl -fsS -m 5 "http://127.0.0.1:$window/"; then
            echo "the container's maintenance port answered after the window closed"; exit 1
          fi
          echo "the container's maintenance port refused after the window closed"
          uv run tundravm attest fixture-1 --policy "$policy" | tee "$RUNNER_TEMP/attest-modes.txt"
          grep -E '^modes  production; 2 switches since boot: maintenance at [0-9]+s, production at [0-9]+s \(RTMR3 replays them\)$' \
            "$RUNNER_TEMP/attest-modes.txt"
          grep -E 'mode-switch: production at [0-9]+s of boot \(switch 2, from maintenance' "$console"
          uv run tundravm run status fixture-1 | grep -E '^firewall +production \(2 switches since boot'

      - name: Follow a second dev instance through dev and stop it with Ctrl-C
        run: |
          setsid .venv/bin/tundravm dev tests/fixtures/native-tree/fixture.py \
            > "$RUNNER_TEMP/dev-follow.txt" 2>&1 &
          pid=$!
          for attempt in $(seq 1 180); do
            test -f .tundravm/instances/fixture-2/probe.json && break
            sleep 10
          done
          sleep 15
          kill -INT -- "-$pid"
          for attempt in $(seq 1 60); do
            kill -0 "$pid" 2>/dev/null || break
            sleep 5
          done
          if kill -0 "$pid" 2>/dev/null; then
            kill -KILL -- "-$pid"
            .venv/bin/tundravm run stop fixture-2 || true
            tail -n 50 "$RUNNER_TEMP/dev-follow.txt"
            echo "dev did not stop within 300s of SIGINT"
            exit 1
          fi
          wait "$pid" && status=0 || status=$?
          cat "$RUNNER_TEMP/dev-follow.txt"
          echo "dev exited $status"
          test "$status" -eq 0
          grep -F 'reusing ' "$RUNNER_TEMP/dev-follow.txt"
          grep -F 'stopped fixture-2' "$RUNNER_TEMP/dev-follow.txt"
          jq -e '.state == "stopped"' .tundravm/instances/fixture-2/instance.json

      - name: Press the dev instance's power button and read an orderly poweroff
        # system_powerdown on the QEMU monitor is the ACPI power button a cloud stop presses:
        # acpid hands it to systemd, which stops the services, unmounts and detaches what they
        # used and powers the kernel down, so QEMU exits by itself.
        run: |
          receipt=.tundravm/instances/fixture-1/instance.json
          console=.tundravm/instances/fixture-1/console.log
          pid=$(jq -r .pid "$receipt")
          python3 -c 'import socket, sys; s = socket.socket(socket.AF_UNIX); s.connect(sys.argv[1]); s.sendall(b"system_powerdown\n")' \
            "$(jq -r .monitor "$receipt")"
          for attempt in $(seq 1 60); do
            kill -0 "$pid" 2>/dev/null || break
            sleep 5
          done
          if kill -0 "$pid" 2>/dev/null; then
            tail -n 80 "$console"
            echo "QEMU still runs 300s after the power button"; exit 1
          fi
          grep -E 'acpid.*button/power' "$console"
          grep -E 'Reached target.*(shutdown\.target|System Shutdown)' "$console"
          grep -F 'All DM devices detached.' "$console"
          grep -F 'reboot: Power down' "$console"

      - name: Stop the instance
        if: always()
        run: |
          uv run tundravm run logs fixture-1 > "$RUNNER_TEMP/boot-logs-run.txt" || true
          uv run tundravm run stop fixture-1 || true
          mkdir -p "$RUNNER_TEMP/boot-logs"
          mv "$RUNNER_TEMP/boot-logs-run.txt" "$RUNNER_TEMP/boot-logs/run-fixture-1.console.log" || true
          cp -r .tundravm/instances "$RUNNER_TEMP/boot-logs/instances" || true

      - name: Upload console logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fixture-console-logs
          path: ${{ runner.temp }}/boot-logs
          if-no-files-found: ignore

  verity:
    # Gate 1 evidence: the fixture image with RootFS.verity() (fixture.py's verity, picked
    # with --attr) built through tundravm, its production qemu.raw booted under QEMU through
    # the ESP fail-closed, the initrd opening the root through dm-verity and mounting the
    # erofs under a volatile overlay on the console; then its dev build run with
    # `tundravm dev --no-follow`, whose platform probe reads the root back (rootfs:verity: a
    # read-only dm-verity target under the overlay, a write under /usr/bin landing in it)
    # and the owner of the page the owners step chowned in that overlay.
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    timeout-minutes: 120
    env:
      TUNDRAVM_BACKEND: local
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Put the build root under the runner's temp
        run: echo "TUNDRAVM_BUILD=$RUNNER_TEMP/verity" >> "$GITHUB_ENV"

      - name: Set up the build host, QEMU and OVMF
        uses: ./.github/actions/setup
        with:
          host: boot
          doctor: build run

      - name: Lock and build the verity fixture
        run: |
          uv run tundravm lock tests/fixtures/native-tree/fixture.py --attr verity
          uv run tundravm build tests/fixtures/native-tree/fixture.py --attr verity --target qemu
          uv run tundravm verify latest
          ls -lL "$TUNDRAVM_BUILD/fixture/latest-production/"

      - name: Boot qemu.raw through its ESP
        env:
          TUNDRAVM_BOOT_REQUIRED: "1"
          TUNDRAVM_BOOT_TIMEOUT: "1500"
          TUNDRAVM_BOOT_LOGS: ${{ runner.temp }}/boot-logs
          TUNDRAVM_VERITY_BUILD: ${{ runner.temp }}/verity/fixture/latest-production
        run: uv run pytest tests/integration/test_verity_boot.py -m boot -v -rsP

      - name: Run the dev build as an instance and read its root from the probe
        run: |
          uv run tundravm dev tests/fixtures/native-tree/fixture.py --attr verity --no-follow
          probe=.tundravm/instances/fixture-1/probe.json
          jq -r '.results[] | "\(.check) \(.verdict) \(.detail)"' "$probe"
          jq -e '.ok' "$probe"
          jq -e '.results[] | select(.check == "rootfs:verity") | .verdict == "ok"' "$probe"
          jq -e '.results[] | select(.check == "owner:/srv/www/private.html")
            | .verdict == "ok"' "$probe"

      - name: Stop the instance
        if: always()
        run: |
          uv run tundravm run stop fixture-1 || true
          mkdir -p "$RUNNER_TEMP/boot-logs"
          cp -r .tundravm/instances "$RUNNER_TEMP/boot-logs/instances" || true

      - name: Upload console logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verity-console-logs
          path: ${{ runner.temp }}/boot-logs
          if-no-files-found: ignore

  verity-cloud:
    # The verity layout's azure and gcp targets: both converters must keep the root and
    # hash partitions byte for byte (tests/integration/test_verity_cloud.py).
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    timeout-minutes: 90
    env:
      TUNDRAVM_BACKEND: local
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up the build host
        uses: ./.github/actions/setup
        with:
          host: build

      - name: Lock and build the verity fixture's cloud targets
        env:
          TUNDRAVM_BUILD: ${{ runner.temp }}/verity-cloud
        run: |
          uv run tundravm lock tests/fixtures/native-tree/fixture.py --attr verity
          uv run tundravm build tests/fixtures/native-tree/fixture.py --attr verity --target azure,gcp
          uv run tundravm verify latest
          ls -lL "$TUNDRAVM_BUILD/fixture/latest-production/"

      - name: The converters keep the verity partitions
        env:
          TUNDRAVM_VERITY_CLOUD_BUILD: ${{ runner.temp }}/verity-cloud/fixture/latest-production
        run: uv run pytest tests/integration/test_verity_cloud.py -v -rs

  reproduce:
    # Gate 1 and 5 evidence: the fixture with its azure and gcp targets built twice through
    # tundravm, the second time in an independent workspace (`build --reproduce`: its own
    # sources, the Local crate copied again, mkosi state and tree); every artifact must
    # match, which exits 1 otherwise. The verity layout's azure target is built twice too:
    # its azure.vhd carries the erofs root and verity hash partitions, which verity-cloud
    # checks are kept byte for byte but builds once.
    # The comparison is recorded in each build directory's observations.json, and each
    # build directory is then verified against its manifest.
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    timeout-minutes: 120
    env:
      TUNDRAVM_BACKEND: local
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Put the build root under the runner's temp
        run: echo "TUNDRAVM_BUILD=$RUNNER_TEMP/reproduce" >> "$GITHUB_ENV"

      - name: Set up the build host
        uses: ./.github/actions/setup
        with:
          host: build
          doctor: build

      - name: Lock, then build the cloud targets twice and compare
        run: |
          uv run tundravm lock tests/fixtures/native-tree/fixture.py
          uv run tundravm build tests/fixtures/native-tree/fixture.py --target azure,gcp --reproduce
          uv run tundravm verify latest

      - name: Lock, then build the verity layout's azure target twice and compare
        run: |
          uv run tundravm lock tests/fixtures/native-tree/fixture.py --attr verity
          uv run tundravm build tests/fixtures/native-tree/fixture.py --attr verity --target azure --reproduce
          uv run tundravm verify latest

      - name: Collect the manifests and the comparisons
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/reproduce-records"
          for build in "$TUNDRAVM_BUILD"/fixture/production/*/; do
            id=$(basename "$build")
            cp "$build/manifest.json" "$RUNNER_TEMP/reproduce-records/$id.manifest.json"
            cp "$build/observations.json" "$RUNNER_TEMP/reproduce-records/$id.observations.json"
            jq '.reproduction' "$build/observations.json"
          done

      - name: Upload the records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reproduce-records
          path: ${{ runner.temp }}/reproduce-records
          if-no-files-found: ignore
