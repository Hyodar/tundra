# test is the unit suite alone; templates and boot bake the Image templates for real, and
# the fixture jobs build tests/fixtures/native-tree/recipe.py, which fetches no source.
#
# Every image implies the evidence service, which builds tundra-tools from
# https://github.com/Hyodar/tundra-tools, a private repository the runner's GITHUB_TOKEN
# cannot read. When the repository secret TUNDRA_TOOLS_TOKEN exists (a fine-grained token
# with read-only Contents on tundra-tools), templates and boot rewrite that URL to carry it
# in the runner's global git config, so the lock's `git ls-remote` and the host-side fetch
# read it:
#   gh secret set TUNDRA_TOOLS_TOKEN --repo Hyodar/tundra
# Their checkouts keep no credentials: the GITHUB_TOKEN header actions/checkout persists
# for github.com would override the token in the URL. With the token, the template tests
# must pass (TUNDRAVM_SOURCES_REQUIRED=1); without it, they skip and say which repository
# they could not read (require_sources in tests/integration/support.py).
name: ci

on:
  push:
    branches:
      - "**"
  pull_request:

env:
  # A step's `if:` cannot read secrets: this says whether the token exists, not what it is.
  HAS_TUNDRA_TOOLS_TOKEN: ${{ secrets.TUNDRA_TOOLS_TOKEN != '' }}

concurrency:
  # A newer push to the same branch (or pull request) cancels the run it supersedes.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Lint, format, types and the unit suite: a fake mkosi and fake checkouts, no sudo, no
    # build host, no network resolution (tests/conftest.py).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check src tests examples

      - name: Typecheck
        run: uv run mypy .

      - name: Unit tests
        run: uv run pytest -m "not integration"

      - name: Check the surge image and its committed tree
        # The surge image tracks upstream branches on purpose and ships no lockfile, so
        # source-unpinned warnings are expected; errors and tree drift fail the step.
        run: uv run tundravm check examples/surge-tdx-prover/image.py --tree examples/surge-tdx-prover/mkosi

  templates:
    # Real mkosi builds on the runner: the smoke recipe (no source builds) and the service
    # and cloud templates, whose evidence service needs tundra-tools (see the header).
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Prepare the build host
        # mkosi comes with tundravm (uv sync); the host needs the Debian keyring for the
        # tools tree and the unprivileged user namespaces Ubuntu 24.04's AppArmor withholds.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq debian-archive-keyring
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Sync dependencies
        run: uv sync

      - name: mkosi and the host
        run: |
          uv run mkosi --version
          uv run tundravm doctor --for build

      - name: Read tundra-tools with TUNDRA_TOOLS_TOKEN
        if: ${{ env.HAS_TUNDRA_TOOLS_TOKEN == 'true' }}
        env:
          TUNDRA_TOOLS_TOKEN: ${{ secrets.TUNDRA_TOOLS_TOKEN }}
        run: |
          git config --global \
            url."https://x-access-token:${TUNDRA_TOOLS_TOKEN}@github.com/Hyodar/tundra-tools".insteadOf \
            "https://github.com/Hyodar/tundra-tools"
          echo "TUNDRAVM_SOURCES_REQUIRED=1" >> "$GITHUB_ENV"

      - name: Bake the smoke recipe and the templates
        run: >-
          uv run pytest tests/integration/test_mkosi_smoke.py
          tests/integration/test_templates_bake.py -m integration -v -rs -rP

  boot:
    # Bakes the minimal and service templates and boots them under QEMU with OVMF (KVM when
    # the runner exposes /dev/kvm, TCG otherwise; no TDX here): payload.efi through -kernel,
    # and the service template's qemu.raw as a disk OVMF boots through its ESP. The
    # templates are Image files whose evidence service builds tundra-tools from its source
    # repository: the bake fetches it, so this job needs read access to that repository
    # (TUNDRA_TOOLS_TOKEN, see the header).
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Prepare the build host, QEMU and OVMF
        # mkosi comes with tundravm (uv sync) and builds in an unprivileged user namespace.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq debian-archive-keyring qemu-system-x86 ovmf
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          qemu-system-x86_64 --version
          ls /usr/share/OVMF

      - name: Let the runner user open /dev/kvm
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            ls -l /dev/kvm
          else
            echo "no /dev/kvm: the boots run on TCG"
          fi

      - name: Sync dependencies
        run: uv sync

      - name: mkosi and the host
        run: |
          uv run mkosi --version
          uv run tundravm doctor --for build
          uv run tundravm doctor --for run

      - name: Read tundra-tools with TUNDRA_TOOLS_TOKEN
        if: ${{ env.HAS_TUNDRA_TOOLS_TOKEN == 'true' }}
        env:
          TUNDRA_TOOLS_TOKEN: ${{ secrets.TUNDRA_TOOLS_TOKEN }}
        run: |
          git config --global \
            url."https://x-access-token:${TUNDRA_TOOLS_TOKEN}@github.com/Hyodar/tundra-tools".insteadOf \
            "https://github.com/Hyodar/tundra-tools"
          echo "TUNDRAVM_SOURCES_REQUIRED=1" >> "$GITHUB_ENV"

      - name: Bake and boot the templates
        env:
          TUNDRAVM_BOOT_REQUIRED: "1"
          TUNDRAVM_BOOT_TIMEOUT: "1500"
          TUNDRAVM_BOOT_LOGS: ${{ runner.temp }}/boot-logs
        run: uv run pytest tests/integration/test_templates_boot.py -m boot -v -rs -rP

      - name: Upload console logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-console-logs
          path: ${{ runner.temp }}/boot-logs
          if-no-files-found: ignore

  fixture-boot:
    # Gate 1, 3 and 5 evidence: the fixture recipe (initramfs root, no source builds) built
    # into build directories, its production profile and its dev one, each verified against
    # its manifest. The production build is booted under QEMU with OVMF both ways
    # (payload.efi through -kernel, qemu.raw through its ESP) by the harness: no TDX here,
    # so it must be fail-closed (tdx-evidence.service refuses, web.service never starts,
    # the boot probe still prints). The dev build runs as an instance with
    # `tundravm run --mode simulated` (KVM when the runner has it, TCG otherwise), where the
    # gate records simulated, until the host fetches the fixture's page through the forward.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TUNDRAVM_BACKEND: local
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Put the build root under the runner's temp
        run: echo "TUNDRAVM_BUILD=$RUNNER_TEMP/fixture" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Prepare the build host, QEMU and OVMF
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq debian-archive-keyring qemu-system-x86 ovmf
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Let the runner user open /dev/kvm
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          else
            echo "no /dev/kvm: the boot runs on TCG"
          fi

      - name: Sync dependencies
        run: uv sync

      - name: mkosi and the host
        run: |
          uv run mkosi --version
          uv run tundravm doctor --for build
          uv run tundravm doctor --for run

      - name: Build the fixture's production and dev profiles
        run: |
          uv run tundravm build tests/fixtures/native-tree/recipe.py --profile default
          uv run tundravm build tests/fixtures/native-tree/recipe.py --profile dev
          ls -lL "$TUNDRAVM_BUILD/fixture/latest-production/" "$TUNDRAVM_BUILD/fixture/latest-development/"

      - name: Verify the build directories and show them
        run: |
          uv run tundravm verify latest
          uv run tundravm verify latest-development
          uv run tundravm show latest
          uv run tundravm show latest --measurements
          uv run tundravm show --diff latest latest-development

      - name: Boot the production build both ways, fail-closed
        env:
          TUNDRAVM_BOOT_REQUIRED: "1"
          TUNDRAVM_BOOT_TIMEOUT: "1500"
          TUNDRAVM_BOOT_LOGS: ${{ runner.temp }}/boot-logs
          TUNDRAVM_FIXTURE_BUILD: ${{ runner.temp }}/fixture/fixture/latest-production
        run: uv run pytest tests/integration/test_fixture_boot.py -m boot -v -rs -rP

      - name: Run the dev build as an instance and fetch its page
        run: |
          uv run tundravm run latest-development --mode simulated --detach
          receipt=.tundravm/instances/fixture-1/instance.json
          port=$(jq -r '.ports["8080"]' "$receipt")
          for attempt in $(seq 1 150); do
            if curl -fsS "http://127.0.0.1:$port/" | grep -q '<h1>fixture</h1>'; then
              echo "page served on :$port after $attempt attempts"
              break
            fi
            sleep 10
          done
          uv run tundravm run status fixture-1
          uv run tundravm run mode fixture-1
          grep -F 'tdx-evidence: no TDX quote path; development profile, running simulated' \
            .tundravm/instances/fixture-1/console.log
          curl -fsS "http://127.0.0.1:$port/" | grep -q '<h1>fixture</h1>'

      - name: Stop the instance
        if: always()
        run: |
          uv run tundravm run logs fixture-1 > "$RUNNER_TEMP/boot-logs-run.txt" || true
          uv run tundravm run stop fixture-1 || true
          mkdir -p "$RUNNER_TEMP/boot-logs"
          mv "$RUNNER_TEMP/boot-logs-run.txt" "$RUNNER_TEMP/boot-logs/run-fixture-1.console.log" || true
          cp -r .tundravm/instances "$RUNNER_TEMP/boot-logs/instances" || true

      - name: Upload console logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixture-console-logs
          path: ${{ runner.temp }}/boot-logs
          if-no-files-found: ignore

  verity:
    # Gate 1 evidence: the fixture recipe with Mkosi(root="verity") (recipe.py's
    # verity_recipe, picked with --attr) built through tundravm, its qemu.raw booted under
    # QEMU through the ESP, and the root asserted to be erofs on dm-verity under a volatile
    # overlay (the fixture's boot-probe task prints it to the console; it is a boot task,
    # which the execution gate does not hold back, so the production build proves it while
    # its services stay fail-closed).
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TUNDRAVM_BACKEND: local
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Put the build root under the runner's temp
        run: echo "TUNDRAVM_BUILD=$RUNNER_TEMP/verity" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Prepare the build host, QEMU and OVMF
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq debian-archive-keyring qemu-system-x86 ovmf
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Let the runner user open /dev/kvm
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          else
            echo "no /dev/kvm: the boot runs on TCG"
          fi

      - name: Sync dependencies
        run: uv sync

      - name: mkosi and the host
        run: |
          uv run mkosi --version
          uv run tundravm doctor --for build
          uv run tundravm doctor --for run

      - name: Build the verity fixture
        run: |
          uv run tundravm build tests/fixtures/native-tree/recipe.py --attr verity_recipe \
            --profile default
          uv run tundravm verify latest
          ls -lL "$TUNDRAVM_BUILD/fixture/latest-production/"

      - name: Boot qemu.raw through its ESP
        env:
          TUNDRAVM_BOOT_REQUIRED: "1"
          TUNDRAVM_BOOT_TIMEOUT: "1500"
          TUNDRAVM_BOOT_LOGS: ${{ runner.temp }}/boot-logs
          TUNDRAVM_VERITY_BUILD: ${{ runner.temp }}/verity/fixture/latest-production
        run: uv run pytest tests/integration/test_verity_boot.py -m boot -v -rs -rP

      - name: Upload console logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verity-console-logs
          path: ${{ runner.temp }}/boot-logs
          if-no-files-found: ignore

  verity-cloud:
    # The verity layout's azure and gcp profiles: both converters must keep the root and
    # hash partitions byte for byte (tests/integration/test_verity_cloud.py).
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TUNDRAVM_BACKEND: local
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Prepare the build host
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq debian-archive-keyring
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Sync dependencies
        run: uv sync

      - name: Build the verity fixture's cloud profiles
        run: |
          mkdir -p "$RUNNER_TEMP/verity-cloud"
          for profile in azure gcp; do
            TUNDRAVM_BUILD="$RUNNER_TEMP/verity-$profile" uv run tundravm build \
              tests/fixtures/native-tree/recipe.py --attr verity_recipe --profile "$profile"
            TUNDRAVM_BUILD="$RUNNER_TEMP/verity-$profile" uv run tundravm verify latest
            ln -s "$(readlink -f "$RUNNER_TEMP/verity-$profile/fixture/latest-production")" \
              "$RUNNER_TEMP/verity-cloud/$profile"
          done
          ls -lL "$RUNNER_TEMP/verity-cloud/azure/" "$RUNNER_TEMP/verity-cloud/gcp/"

      - name: The converters keep the verity partitions
        env:
          TUNDRAVM_VERITY_CLOUD_BUILD: ${{ runner.temp }}/verity-cloud
        run: uv run pytest tests/integration/test_verity_cloud.py -v -rs

  reproduce:
    # Gate 1 and 5 evidence: the fixture's azure and gcp profiles each built twice through
    # tundravm, the second time in an independent workspace (`build --reproduce`: its own
    # sources, mkosi state and tree); every artifact must match, which exits 1 otherwise.
    # The comparison is recorded in each build directory's observations.json, and each
    # build directory is then verified against its manifest.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TUNDRAVM_BACKEND: local
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Put the build root under the runner's temp
        run: echo "TUNDRAVM_BUILD=$RUNNER_TEMP/reproduce" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Prepare the build host
        # Same as the boot job without QEMU: mkosi builds in an unprivileged user namespace.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq debian-archive-keyring
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Sync dependencies
        run: uv sync

      - name: mkosi and the host
        run: |
          uv run mkosi --version
          uv run tundravm doctor --for build

      - name: Build each cloud profile twice and compare
        run: |
          for profile in azure gcp; do
            uv run tundravm build tests/fixtures/native-tree/recipe.py --profile "$profile" \
              --reproduce
            uv run tundravm verify latest
          done

      - name: Collect the manifests and the comparisons
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/reproduce-records"
          for build in "$TUNDRAVM_BUILD"/fixture/production/*/; do
            id=$(basename "$build")
            cp "$build/manifest.json" "$RUNNER_TEMP/reproduce-records/$id.manifest.json"
            cp "$build/observations.json" "$RUNNER_TEMP/reproduce-records/$id.observations.json"
            jq '.reproduction' "$build/observations.json"
          done

      - name: Upload the records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reproduce-records
          path: ${{ runner.temp }}/reproduce-records
          if-no-files-found: ignore
