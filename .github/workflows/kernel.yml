# Kernels built from source, too slow for every push: tests/fixtures/kernel/recipe.py compiles
# Debian trixie's 6.12 kernel from its own cloud-amd64 config, hardened, CONFIG_MODULES=n, the way
# Kernel.build(...) does, and tests/fixtures/kernel/example.py one from its own
# config. Each build's drivers check asserts
# every driver the qemu, azure and gcp targets need is built in (=y) and the denied ones are
# off; each job uploads the config before and after olddefconfig, the check's report and the
# diff summary, then boots the dev profile's qemu.raw under QEMU with OVMF until the
# fixture's probe service has printed what the kernel registered. Weekly, and by hand:
#   gh workflow run kernel.yml --ref BRANCH
name: kernel

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

concurrency:
  group: kernel
  cancel-in-progress: false

jobs:
  kernel:
    name: kernel (${{ matrix.fixture }})
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - fixture: recipe
            image: kernel
          - fixture: example
            image: kernel-example
    env:
      TUNDRAVM_BACKEND: local
      FIXTURE: tests/fixtures/kernel/${{ matrix.fixture }}.py
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Put the build root under the runner's temp
        run: |
          echo "TUNDRAVM_BUILD=$RUNNER_TEMP/kernel" >> "$GITHUB_ENV"
          echo "BUILD_DIR=$RUNNER_TEMP/kernel/${{ matrix.image }}/latest-development" >> "$GITHUB_ENV"
          echo "RECORDS=$RUNNER_TEMP/kernel-records" >> "$GITHUB_ENV"

      - name: Set up the build host, QEMU and OVMF
        uses: ./.github/actions/setup
        with:
          host: boot
          doctor: build run

      - name: Lock and build the fixture
        run: |
          uv run tundravm lock "$FIXTURE"
          uv run tundravm build "$FIXTURE" --dev
          uv run tundravm verify latest-development
          ls -lL "$BUILD_DIR/" "$BUILD_DIR/kernel/"
          df -h /

      - name: Summarize what olddefconfig did to the base config
        run: |
          build="$BUILD_DIR"
          mkdir -p "$RECORDS"
          cp "$build"/kernel/* "$build/manifest.json" "$RECORDS/"
          jq '.kernel' "$build/manifest.json"
          before="$build/kernel/config.before" after="$build/kernel/config.after"
          sed -n 's/^\(CONFIG_[A-Z0-9_]*\)=m$/\1/p' "$before" | sort > "$RECORDS/modules.before"
          sed -n 's/^\(CONFIG_[A-Z0-9_]*\)=y$/\1/p' "$after" | sort > "$RECORDS/builtin.after"
          comm -12 "$RECORDS/modules.before" "$RECORDS/builtin.after" > "$RECORDS/m-to-y.txt"
          comm -23 "$RECORDS/modules.before" "$RECORDS/builtin.after" > "$RECORDS/m-dropped.txt"
          {
            echo "base config =m options:$(wc -l < "$RECORDS/modules.before")"
            echo "=m became =y: $(wc -l < "$RECORDS/m-to-y.txt")"
            echo "=m dropped: $(wc -l < "$RECORDS/m-dropped.txt")"
            echo "drivers check: $(grep -c ' required by ' "$build/kernel/drivers.txt") required, $(grep -c ' denied$' "$build/kernel/drivers.txt") denied, all passed"
            echo
            echo "dropped:"
            for option in $(cat "$RECORDS/m-dropped.txt"); do
              value=$(sed -n "s/^$option=//p" "$after")
              echo "  $option -> ${value:-n}"
            done
          } | tee "$RECORDS/summary.txt" >> "$GITHUB_STEP_SUMMARY"
          cat "$RECORDS/summary.txt"

      - name: Boot qemu.raw through its ESP
        env:
          TUNDRAVM_BOOT_REQUIRED: "1"
          TUNDRAVM_BOOT_TIMEOUT: "1500"
          TUNDRAVM_BOOT_LOGS: ${{ runner.temp }}/kernel-records/boot-logs
          TUNDRAVM_KERNEL_BUILD: ${{ runner.temp }}/kernel/${{ matrix.image }}/latest-development
          TUNDRAVM_KERNEL_FIXTURE: ${{ matrix.fixture }}
        run: uv run pytest tests/integration/test_kernel_boot.py -m boot -v -rsP

      - name: Upload the configs, the check's report and the console log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kernel-records-${{ matrix.fixture }}
          path: ${{ runner.temp }}/kernel-records
          if-no-files-found: ignore
