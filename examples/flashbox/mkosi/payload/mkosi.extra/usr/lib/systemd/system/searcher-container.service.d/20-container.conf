[Unit]
After=searcher-container-loop.service searcher-container-net.service searcher-container-endpoint-8545.socket searcher-container-ssh-keys.service
Requires=searcher-container-loop.service searcher-container-net.service searcher-container-endpoint-8545.socket searcher-container-ssh-keys.service

[Service]
BindPaths=/persistent/data/searcher:/persistent/data/searcher
BindPaths=/persistent/data/input:/persistent/data/input
BindReadOnlyPaths=/run/tundravm/containers/searcher-container/host:/etc/ssh/tundravm/host
BindReadOnlyPaths=/run/tundravm/containers/searcher-container/keys:/etc/ssh/tundravm/keys
MountAPIVFS=yes
NetworkNamespacePath=/run/netns/searcher-container
PrivatePIDs=yes
PrivateUsers=yes
ProtectProc=invisible
RootImage=/usr/lib/tundravm/containers/searcher-container.raw
