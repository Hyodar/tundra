[Unit]
After=bob-net.service bob-nethermind-rpc.socket bob-ssh-keys.service
Requires=bob-net.service bob-nethermind-rpc.socket bob-ssh-keys.service

[Service]
BindPaths=/persistent/data/searcher:/persistent/data/searcher
BindPaths=/persistent/data/input:/persistent/data/input
BindReadOnlyPaths=/persistent/data/lighthouse-logs:/persistent/data/lighthouse-logs
BindReadOnlyPaths=/run/tundravm/containers/bob/host:/etc/ssh/tundravm/host
BindReadOnlyPaths=/run/tundravm/containers/bob/keys:/etc/ssh/tundravm/keys
MountAPIVFS=yes
NetworkNamespacePath=/run/netns/bob
PrivatePIDs=yes
PrivateUsers=yes
ProtectProc=invisible
RootImage=/usr/lib/tundravm/containers/bob.raw
