#!/usr/sbin/nft -f
# tundravm Firewall: inbound traffic is dropped unless a rule below accepts it;
# outbound traffic is dropped unless a rule in the output chain accepts it.
# The cloud metadata servers take only what the units that declare them send.
# Host names: egress-resolve fills each host4_/host6_ set from DNS over TLS at
# boot and every 30s; a rule naming one accepts nothing until it has.
# Modes: mode-switch swaps mode_input/mode_output and current_mode; a flow
# keeps its mode's ct mark and drops once another mode is in force.
flush ruleset

table inet filter {
	set current_mode {
		type mark
		elements = { 0x00000001 }
	}
	set host4_time.cloudflare.com {
		type ipv4_addr
	}
	set host6_time.cloudflare.com {
		type ipv6_addr
	}
	set host4_nts.netnod.se {
		type ipv4_addr
	}
	set host6_nts.netnod.se {
		type ipv6_addr
	}
	set host4_mainnet.checkpoint.sigp.io {
		type ipv4_addr
	}
	set host6_mainnet.checkpoint.sigp.io {
		type ipv6_addr
	}
	chain production_input {
	}
	chain maintenance_input {
		tcp dport 10022 ct mark set 0x00000002 accept comment "maintenance: searcher-container"
		tcp dport 30303 ct mark set 0x00000002 accept comment "maintenance: allow"
		udp dport 30303 ct mark set 0x00000002 accept comment "maintenance: allow"
	}
	chain mode_input {
		jump production_input
	}
	chain input {
		type filter hook input priority filter; policy drop;
		ct state established,related ct mark 0x00000000 accept
		ct state established,related ct mark @current_mode accept
		ct state invalid drop
		iifname "lo" accept
		iifname "ve-searche-0bd8" meta l4proto tcp reject with tcp reset comment "searcher-container: not the host"
		iifname "ve-searche-0bd8" reject with icmpx type admin-prohibited comment "searcher-container: not the host"
		icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept
		udp sport 67 udp dport 68 accept comment "DHCPv4 replies"
		ip6 saddr fe80::/10 udp sport 547 udp dport 546 accept comment "DHCPv6 replies"
		tcp dport 22 accept comment "ssh.service"
		tcp dport 8745 accept comment "attested-endpoint"
		tcp dport 9000 accept comment "lighthouse.service"
		udp dport 9000 accept comment "lighthouse.service"
		tcp dport 27018 accept comment "input-proxy.service"
		jump mode_input
	}
	chain forward {
		type filter hook forward priority filter; policy drop;
		ct state established,related ct mark 0x00000000 accept
		ct state established,related ct mark @current_mode accept
		ct state invalid drop
		iifname "ve-searche-0bd8" ip daddr { 168.63.129.16, 169.254.169.254 } meta l4proto tcp reject with tcp reset comment "searcher-container: cloud metadata"
		iifname "ve-searche-0bd8" ip daddr { 168.63.129.16, 169.254.169.254 } reject with icmpx type admin-prohibited comment "searcher-container: cloud metadata"
		iifname "ve-searche-0bd8" ip6 daddr fd20:ce::254 meta l4proto tcp reject with tcp reset comment "searcher-container: cloud metadata"
		iifname "ve-searche-0bd8" ip6 daddr fd20:ce::254 reject with icmpx type admin-prohibited comment "searcher-container: cloud metadata"
		iifname "ve-searche-0bd8" ip daddr 18.221.59.61 tcp dport 443 accept comment "searcher-container (backruns.tee-searcher.flashbots.net)"
		iifname "ve-searche-0bd8" ip daddr 3.15.88.156 tcp dport 443 accept comment "searcher-container (backruns.tee-searcher.flashbots.net)"
		iifname "ve-searche-0bd8" ip daddr 3.149.14.12 tcp dport 443 meta mark set 0x00000001 meta mark @current_mode ct mark set meta mark accept comment "searcher-container: production (tx.tee-searcher.flashbots.net)"
		iifname "ve-searche-0bd8" ip daddr 3.136.107.142 tcp dport 443 meta mark set 0x00000001 meta mark @current_mode ct mark set meta mark accept comment "searcher-container: production (tx.tee-searcher.flashbots.net)"
		iifname "ve-searche-0bd8" ip daddr 200.225.47.181 tcp dport 443 meta mark set 0x00000001 meta mark @current_mode ct mark set meta mark accept comment "searcher-container: production (fb-om-use1-00.nodes.buildernet.org)"
		iifname "ve-searche-0bd8" ip daddr 200.225.47.183 tcp dport 443 meta mark set 0x00000001 meta mark @current_mode ct mark set meta mark accept comment "searcher-container: production (fb-om-use1-01.nodes.buildernet.org)"
		iifname "ve-searche-0bd8" ip daddr 198.203.202.53 tcp dport 443 meta mark set 0x00000001 meta mark @current_mode ct mark set meta mark accept comment "searcher-container: production (fb-om-euw1-00.nodes.buildernet.org)"
		iifname "ve-searche-0bd8" ip daddr 198.203.202.55 tcp dport 443 meta mark set 0x00000001 meta mark @current_mode ct mark set meta mark accept comment "searcher-container: production (fb-om-euw1-01.nodes.buildernet.org)"
		iifname "ve-searche-0bd8" ip daddr 34.104.157.101 tcp dport 443 meta mark set 0x00000001 meta mark @current_mode ct mark set meta mark accept comment "searcher-container: production (fb-gcp-ane1-00.nodes.buildernet.org)"
		iifname "ve-searche-0bd8" ip daddr 35.213.62.127 tcp dport 443 meta mark set 0x00000001 meta mark @current_mode ct mark set meta mark accept comment "searcher-container: production (fb-gcp-ane1-01.nodes.buildernet.org)"
		iifname "ve-searche-0bd8" tcp dport 53 meta mark set 0x00000002 meta mark @current_mode ct mark set meta mark accept comment "searcher-container: maintenance"
		iifname "ve-searche-0bd8" udp dport 53 meta mark set 0x00000002 meta mark @current_mode ct mark set meta mark accept comment "searcher-container: maintenance"
		iifname "ve-searche-0bd8" tcp dport 80 meta mark set 0x00000002 meta mark @current_mode ct mark set meta mark accept comment "searcher-container: maintenance"
		iifname "ve-searche-0bd8" tcp dport 443 meta mark set 0x00000002 meta mark @current_mode ct mark set meta mark accept comment "searcher-container: maintenance"
		iifname "ve-searche-0bd8" tcp dport 853 meta mark set 0x00000002 meta mark @current_mode ct mark set meta mark accept comment "searcher-container: maintenance"
		iifname "ve-searche-0bd8" meta l4proto tcp reject with tcp reset comment "searcher-container: no egress rule"
		iifname "ve-searche-0bd8" reject with icmpx type admin-prohibited comment "searcher-container: no egress rule"
		oifname "ve-searche-0bd8" ct status dnat udp dport 27017 accept comment "searcher-container"
		oifname "ve-searche-0bd8" ct status dnat jump mode_input
	}
	chain prerouting {
		type nat hook prerouting priority dstnat; policy accept;
		udp dport 27017 dnat ip to 169.254.96.162 comment "searcher-container"
		tcp dport 10022 dnat ip to 169.254.96.162 comment "searcher-container"
	}
	chain postrouting {
		type nat hook postrouting priority srcnat; policy accept;
		ip saddr 169.254.96.162 oifname != "ve-searche-0bd8" masquerade comment "searcher-container"
	}
	chain production_output {
	}
	chain maintenance_output {
	}
	chain mode_output {
		jump production_output
	}
	chain output {
		type filter hook output priority filter; policy drop;
		ct state established,related ct mark 0x00000000 accept
		ct state established,related ct mark @current_mode accept
		ct state invalid drop
		oifname "lo" accept
		icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept
		udp sport 68 udp dport 67 accept comment "DHCPv4 requests"
		udp sport 546 udp dport 547 accept comment "DHCPv6 requests"
		meta skuid 0 meta skgid "azure-complete-provisioning" ip daddr 168.63.129.16 accept comment "azure-complete-provisioning.service"
		meta skuid 0 meta skgid "gcp-hostname" ip daddr 169.254.169.254 accept comment "gcp-hostname.service"
		meta skuid 0 meta skgid "gcp-forwarded-ips" ip daddr 169.254.169.254 accept comment "gcp-forwarded-ips.service"
		ip daddr 169.254.169.254 udp dport 123 accept comment "metadata time"
		ip daddr { 168.63.129.16, 169.254.169.254 } drop comment "cloud metadata"
		ip6 daddr fd20:ce::254 drop comment "cloud metadata"
		meta skuid "_chrony" udp dport 123 accept comment "tee-base"
		tcp dport 9000 accept comment "lighthouse"
		udp dport 9000 accept comment "lighthouse"
		tcp dport 30303 accept comment "nethermind"
		udp dport 30303 accept comment "nethermind"
		ip daddr @host4_time.cloudflare.com tcp dport 4460 accept comment "tee-base"
		ip6 daddr @host6_time.cloudflare.com tcp dport 4460 accept comment "tee-base"
		ip daddr @host4_nts.netnod.se tcp dport 4460 accept comment "tee-base"
		ip6 daddr @host6_nts.netnod.se tcp dport 4460 accept comment "tee-base"
		ip daddr 1.1.1.1 tcp dport 853 accept comment "network"
		ip daddr 1.0.0.1 tcp dport 853 accept comment "network"
		ip daddr @host4_mainnet.checkpoint.sigp.io tcp dport 443 accept comment "lighthouse"
		ip6 daddr @host6_mainnet.checkpoint.sigp.io tcp dport 443 accept comment "lighthouse"
		ip daddr 10.88.0.100 tcp dport 443 accept comment "observability"
		jump mode_output
	}
}
