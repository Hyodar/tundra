# tundravm TeeBase
# hide kernel pointers from every user (KSPP: kspp.github.io/Recommended_Settings)
-kernel.kptr_restrict = 2
# only CAP_SYSLOG reads the kernel log (KSPP: kspp.github.io/Recommended_Settings)
-kernel.dmesg_restrict = 1
# no unprivileged eBPF, for good (KSPP: kspp.github.io/Recommended_Settings)
-kernel.unprivileged_bpf_disabled = 1
# constant blinding in the BPF JIT (KSPP: kspp.github.io/Recommended_Settings)
-net.core.bpf_jit_harden = 2
# the measured kernel cannot be replaced (KSPP: kspp.github.io/Recommended_Settings)
-kernel.kexec_load_disabled = 1
# only CAP_SYS_PTRACE attaches to processes (KSPP: kspp.github.io/Recommended_Settings)
-kernel.yama.ptrace_scope = 2
# no unprivileged perf events (flashbots-images shared/mkosi.extra/etc/sysctl.d)
-kernel.perf_event_paranoid = 3
# the host-owned console sends no magic SysRq (linux: Documentation/admin-guide/sysctl/kernel)
-kernel.sysrq = 0
# setuid programs never dump core (KSPP: kspp.github.io/Recommended_Settings)
-fs.suid_dumpable = 0
# no symlink races in sticky dirs (flashbots-images shared/mkosi.extra/etc/sysctl.d)
-fs.protected_symlinks = 1
# no hardlinks to others' files (flashbots-images shared/mkosi.extra/etc/sysctl.d)
-fs.protected_hardlinks = 1
# no FIFO spoofing in sticky dirs (KSPP: kspp.github.io/Recommended_Settings)
-fs.protected_fifos = 2
# no regular-file spoofing in sticky dirs (KSPP: kspp.github.io/Recommended_Settings)
-fs.protected_regular = 2
# ignore ICMP redirects (linux: Documentation/admin-guide/sysctl/net)
-net.ipv4.conf.all.accept_redirects = 0
# ignore ICMP redirects on new interfaces
-net.ipv4.conf.default.accept_redirects = 0
# ignore ICMPv6 redirects (linux: Documentation/admin-guide/sysctl/net)
-net.ipv6.conf.all.accept_redirects = 0
# the guest is not a router (linux: Documentation/admin-guide/sysctl/net)
-net.ipv4.conf.all.send_redirects = 0
# drop source-routed packets
-net.ipv4.conf.all.accept_source_route = 0
# drop unroutable sources (linux: Documentation/admin-guide/sysctl/net)
-net.ipv4.conf.all.rp_filter = 2
# survive SYN floods (linux: Documentation/admin-guide/sysctl/net)
-net.ipv4.tcp_syncookies = 1
