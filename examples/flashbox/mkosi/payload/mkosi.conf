[Config]
Dependencies=bob

[Output]
Format=disk
Output=payload
Seed=7a9ceb63-4a2c-4a85-9c36-1e0e3a8f7b5d
ManifestFormat=json
SplitArtifacts=uki,partitions

[Content]
Bootable=yes
Bootloader=uki
CleanPackageMetadata=yes
KernelCommandLine=root=/dev/mapper/root systemd.verity_root_data=/dev/disk/by-partuuid/b61fd526-641e-507d-9c9c-960c43f20ee5 systemd.verity_root_hash=/dev/disk/by-partuuid/376d596e-c008-5e51-ad0d-ec14c9aa7002 systemd.volatile=overlay mitigations=auto,nosmt spec_store_bypass_disable=on transparent_hugepage=madvise
Packages=
    acpid
    cryptsetup
    curl
    e2fsprogs
    mount
    openssl
    passwd
BuildPackages=
    bc
    bison
    build-essential
    dpkg-dev
    flex
    git
    golang
    libelf-dev
    libicu76
    libssl-dev
    libssl3t64
    libstdc++6
    patch
    xz-utils
    zstd
ExtraTrees=%O/bob.raw:/usr/lib/tundravm/containers/bob.raw

[Validation]
Verity=hash
