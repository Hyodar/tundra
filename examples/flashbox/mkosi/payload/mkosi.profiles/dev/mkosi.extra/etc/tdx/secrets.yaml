listen: "0.0.0.0:8745"
quote_socket: "/var/tdxs.sock"
ssh_host_keys: "/etc/ssh/ssh_host_*_key.pub"
instance_key: "/run/tundravm/instance-key.pub"
mode_file: "/run/tundravm/mode"
ssh:
  login: "searcher"
  pty: true
credentials:
  - name: "searcher-keys"
    path: "/run/tundravm/credentials/searcher-keys"
    mode: "0600"
  - name: "searcher-keys"
    path: "/run/tundravm/containers/searcher-container/keys/authorized_keys"
    mode: "0644"
volumes:
  - name: "data"
    pipe: "/run/tundravm/unlock/data"
    owner: "/run/tundravm/owner/data"
attested_tls: []
containers:
  - name: "searcher-container"
    port: 10022
    host_keys: "/run/tundravm/containers/searcher-container/host/ssh_host_*_key.pub"
    keys: "/run/tundravm/containers/searcher-container/keys"
