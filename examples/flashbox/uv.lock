version = 1
revision = 3
requires-python = ">=3.12"

[[package]]
name = "flashbox"
version = "0.1.0"
source = { virtual = "." }
dependencies = [
    { name = "tundravm" },
]

[package.metadata]
requires-dist = [{ name = "tundravm", editable = "../../" }]

[[package]]
name = "mkosi"
version = "27.1"
source = { git = "https://github.com/systemd/mkosi?rev=ecf7f5702bb2052b7a69cab3fe7d37bc3b9ad77b#ecf7f5702bb2052b7a69cab3fe7d37bc3b9ad77b" }

[[package]]
name = "tundravm"
source = { editable = "../../" }
dependencies = [
    { name = "mkosi" },
]

[package.metadata]
requires-dist = [{ name = "mkosi", git = "https://github.com/systemd/mkosi?rev=ecf7f5702bb2052b7a69cab3fe7d37bc3b9ad77b" }]

[package.metadata.requires-dev]
dev = [
    { name = "hatchling", specifier = ">=1.27.0" },
    { name = "mypy", specifier = ">=1.11.2" },
    { name = "pytest", specifier = ">=8.3.3" },
    { name = "pytest-xdist", specifier = ">=3.8.0" },
    { name = "pyyaml", specifier = ">=6.0.2" },
    { name = "ruff", specifier = ">=0.6.9" },
    { name = "types-pyyaml", specifier = "==6.0.12.20260906" },
]
