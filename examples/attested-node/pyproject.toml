# The attested node is a tundravm project: its image files import components/ from here.
[project]
name = "attested-node"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["tundravm"]

[tool.uv.sources]
# This repository's checkout, where a project of its own pins tundravm from git.
tundravm = { path = "../..", editable = true }

[tool.tundravm]
image = "image.py"
