global:
  scrape_interval: 30s
scrape_configs:
  - job_name: node
    static_configs:
      - targets: ["127.0.0.1:9100"]
remote_write:
  - url: http://127.0.0.1:9091/api/v1/write
    queue_config:
      capacity: 10000
      max_shards: 4
      min_backoff: 1s
      max_backoff: 1m
      retry_on_http_429: true
