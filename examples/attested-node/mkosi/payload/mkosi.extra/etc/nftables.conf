#!/usr/sbin/nft -f
# tundravm Firewall: inbound traffic is dropped unless a rule below accepts it;
# outbound traffic is dropped unless a rule in the output chain accepts it.
# The cloud metadata servers take only what the units that declare them send.
# Host names: egress-resolve fills each host4_/host6_ set from DNS over TLS at
# boot and every 30s; a rule naming one accepts nothing until it has.
flush ruleset

table inet filter {
	set host4_time.cloudflare.com {
		type ipv4_addr
	}
	set host6_time.cloudflare.com {
		type ipv6_addr
	}
	set host4_nts.netnod.se {
		type ipv4_addr
	}
	set host6_nts.netnod.se {
		type ipv6_addr
	}
	set host4_checkpoint-sync.hoodi.ethpandaops.io {
		type ipv4_addr
	}
	set host6_checkpoint-sync.hoodi.ethpandaops.io {
		type ipv6_addr
	}
	chain input {
		type filter hook input priority filter; policy drop;
		ct state established,related accept
		ct state invalid drop
		iifname "lo" accept
		icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept
		udp sport 67 udp dport 68 accept comment "DHCPv4 replies"
		ip6 saddr fe80::/10 udp sport 547 udp dport 546 accept comment "DHCPv6 replies"
		tcp dport 22 accept comment "ssh.service"
		tcp dport 8546 accept comment "attested-tls-8546.service"
		tcp dport 8745 accept comment "attested-endpoint"
	}
	chain forward {
		type filter hook forward priority filter; policy drop;
	}
	chain output {
		type filter hook output priority filter; policy drop;
		ct state established,related accept
		ct state invalid drop
		oifname "lo" accept
		icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept
		meta skuid "systemd-network" udp sport 68 udp dport 67 accept comment "DHCPv4 requests"
		meta skuid "systemd-network" udp sport 546 udp dport 547 accept comment "DHCPv6 requests"
		meta skuid 0 meta skgid "azure-complete-provisioning" ip daddr 168.63.129.16 accept comment "azure-complete-provisioning.service"
		meta skuid 0 meta skgid "gcp-hostname" ip daddr 169.254.169.254 accept comment "gcp-hostname.service"
		meta skuid 0 meta skgid "gcp-forwarded-ips" ip daddr 169.254.169.254 accept comment "gcp-forwarded-ips.service"
		ip daddr 169.254.169.254 udp dport 123 accept comment "metadata time"
		ip daddr { 168.63.129.16, 169.254.169.254 } drop comment "cloud metadata"
		ip6 daddr fd20:ce::254 drop comment "cloud metadata"
		meta skuid "_chrony" udp dport 123 accept comment "tee-base"
		meta skuid "lighthouse" tcp dport 9000 accept comment "lighthouse"
		meta skuid "lighthouse" udp dport 9000 accept comment "lighthouse"
		meta skuid "lighthouse" udp dport 9001 accept comment "lighthouse"
		meta skuid "nethermind" tcp dport 30303 accept comment "nethermind"
		meta skuid "nethermind" udp dport 30303 accept comment "nethermind"
		meta skuid "_chrony" ip daddr @host4_time.cloudflare.com tcp dport 4460 accept comment "tee-base"
		meta skuid "_chrony" ip6 daddr @host6_time.cloudflare.com tcp dport 4460 accept comment "tee-base"
		meta skuid "_chrony" ip daddr @host4_nts.netnod.se tcp dport 4460 accept comment "tee-base"
		meta skuid "_chrony" ip6 daddr @host6_nts.netnod.se tcp dport 4460 accept comment "tee-base"
		meta skuid "systemd-resolve" ip daddr 1.1.1.1 tcp dport 853 accept comment "network"
		meta skuid "systemd-resolve" ip daddr 1.0.0.1 tcp dport 853 accept comment "network"
		meta skuid "lighthouse" ip daddr @host4_checkpoint-sync.hoodi.ethpandaops.io tcp dport 443 accept comment "lighthouse"
		meta skuid "lighthouse" ip6 daddr @host6_checkpoint-sync.hoodi.ethpandaops.io tcp dport 443 accept comment "lighthouse"
	}
}
