listen: "0.0.0.0:8745"
quote_socket: "/var/tdxs.sock"
ssh_host_keys: "/etc/ssh/ssh_host_*_key.pub"
instance_key: "/run/tundravm/instance-key.pub"
mode_file: "/run/tundravm/mode"
ssh:
  dir: "/root/.ssh"
credentials:
  - name: "jwt"
    path: "/run/tundravm/credentials/jwt"
    mode: "0600"
  - name: "raiko-config"
    path: "/run/tundravm/credentials/raiko-config"
    mode: "0600"
  - name: "taiko-chain"
    path: "/run/tundravm/credentials/taiko-chain"
    mode: "0600"
volumes:
  - name: "data"
    pipe: "/run/tundravm/unlock/data"
