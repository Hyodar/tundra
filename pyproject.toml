[build-system]
requires = ["hatchling>=1.27.0", "hatch-vcs>=0.5.0"]
build-backend = "hatchling.build"

[project]
name = "tundravm"
dynamic = ["version"]
description = "Python SDK for declarative TDX-enabled VM image workflows."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "tundravm contributors" }]
dependencies = [
    "mkosi",
]

[project.scripts]
tundravm = "tundravm.cli:main"

[project.entry-points.pytest11]
tundravm = "tundravm.testing.pytest_plugin"

[project.urls]
Homepage = "https://github.com/Hyodar/tundra"
Repository = "https://github.com/Hyodar/tundra"
Changelog = "https://github.com/Hyodar/tundra/blob/master/CHANGELOG.md"

[dependency-groups]
dev = [
  "hatchling>=1.27.0",
  "mypy>=1.11.2",
  "pytest>=8.3.3",
  "ruff>=0.6.9",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: integration tests (deselect with '-m \"not integration\"')",
    "boot: boots a baked image under QEMU (needs qemu-system-x86_64 and OVMF)",
    "boundary: runs the real process boundary (the mkosi adapter, source fetches, host checks) instead of the unit suite's fakes",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "examples", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Udev rules are single-line domain content that cannot be reformatted
"src/tundravm/_platforms/gcp.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
mypy_path = ["src"]
packages = ["tundravm"]
strict = true

[tool.hatch.version]
# The release tag (v2.0.0) is the version; between tags, <last tag>.post1.dev<n>+g<sha>.
source = "vcs"
raw-options = { version_scheme = "no-guess-dev" }

[tool.hatch.build.hooks.custom]
# hatch_build.py writes src/tundravm/_version.py: the version and the commit it was built from.

[tool.hatch.build.targets.wheel]
packages = ["src/tundravm"]
exclude = ["/tools"]

[tool.hatch.build.targets.sdist]
# tools/ is the Go module images build from this repository, never part of the package
exclude = ["/tools"]

[tool.uv]
# A commit or a tag changes the version, so uv reinstalls the editable checkout on either.
cache-keys = [{ file = "pyproject.toml" }, { file = "hatch_build.py" }, { git = { commit = true, tags = true } }]

[tool.uv.sources]
mkosi = { git = "https://github.com/systemd/mkosi", rev = "v27.1" }

[[tool.mypy.overrides]]
# mkosi ships no py.typed; follow its annotated source so the adapter is checked against it
module = ["mkosi", "mkosi.*"]
follow_untyped_imports = true
