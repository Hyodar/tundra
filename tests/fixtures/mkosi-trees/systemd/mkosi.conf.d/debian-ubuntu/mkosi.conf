# SPDX-License-Identifier: LGPL-2.1-or-later

[Match]
Distribution=|debian
Distribution=|ubuntu

[Content]
PrepareScripts=systemd.prepare
VolatilePackages=
        libnss-myhostname
        libnss-resolve
        libnss-systemd
        libpam-systemd
        libsystemd-shared
        libsystemd0
        systemd
        systemd-container
        systemd-coredump
        systemd-cryptsetup
        systemd-repart
        systemd-resolved
        systemd-sysv
        systemd-timesyncd
        systemd-ukify
        systemd-userdbd
        udev

Packages=
        btrfs-progs
        apt
        cryptsetup-bin
        dbus-broker
        dbus-user-session
        erofs-utils
        fdisk
        iproute2
        iputils-ping
        locales
        login
        openssh-client
        openssh-server
        passwd
        polkitd
        procps
        # kernel-bootcfg --add-uri= is just too useful
        python3-virt-firmware
        tpm2-tools
        tzdata
