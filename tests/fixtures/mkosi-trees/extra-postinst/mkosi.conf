# A small web host: a static site under mkosi.extra/, a unit for the server, a skeleton tree
# the packages install over, and a post-installation script that enables the unit.

[Distribution]
Distribution=debian
Release=trixie

[Output]
Format=disk
ImageId=greeter

[Content]
Bootable=yes
Packages=
        busybox
        systemd
        udev
        linux-image-amd64
        openssl
