listen: "0.0.0.0:8745"
quote_socket: "/var/tdxs.sock"
ssh_host_keys: "/etc/ssh/ssh_host_*_key.pub"
instance_key: "/run/tundravm/instance-key.pub"
mode_file: "/run/tundravm/mode"
ssh:
  login: "tenant"
credentials: []
volumes:
  - name: "vault"
    pipe: "/run/tundravm/unlock/vault"
    owner: "/run/tundravm/owner/vault"
attested_tls:
  - port: 8443
    certificate: "/run/tundravm/attested-tls/8443/cert.pem"
containers:
  - name: "box"
    port: 10022
    host_keys: "/run/tundravm/containers/box/host/ssh_host_*_key.pub"
    keys: "/run/tundravm/containers/box/keys"
