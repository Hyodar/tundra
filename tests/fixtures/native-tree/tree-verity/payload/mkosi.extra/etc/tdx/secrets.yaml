listen: "0.0.0.0:8745"
quote_socket: "/var/tdxs.sock"
ssh_host_keys: "/etc/ssh/ssh_host_*_key.pub"
instance_key: "/run/tundravm/instance-key.pub"
mode_file: "/run/tundravm/mode"
ssh:
  dir: "/root/.ssh"
credentials:
  - name: "greeting-token"
    path: "/run/tundravm/credentials/greeting-token"
    mode: "0600"
  - name: "tenant-keys"
    path: "/run/tundravm/credentials/tenant-keys"
    mode: "0600"
  - name: "tenant-keys"
    path: "/etc/ssh/authorized_keys.d/tenant"
    mode: "0644"
volumes: []
attested_tls:
  - port: 8443
    certificate: "/run/tundravm/attested-tls/8443/cert.pem"
