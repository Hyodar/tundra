global:
  scrape_interval: 10s
  evaluation_interval: 10s
rule_files: [/etc/tundravm/metrics-rules.yml]
scrape_configs:
  - job_name: node
    static_configs:
      - targets: ["127.0.0.1:9100"]
remote_write:
  - url: http://127.0.0.2:19581/api/v1/write
    proxy_url: http://127.0.0.1:19582
    write_relabel_configs:
      - source_labels: [__name__]
        regex: "fixture:memory_available_over_10_percent|fixture:node_up|tundravm_image_digest|tundravm_image_rtmr|tundravm_mode"
        action: keep
    queue_config:
      capacity: 10000
      max_shards: 4
      min_backoff: 1s
      max_backoff: 1m
      retry_on_http_429: true
