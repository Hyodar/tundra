[Unit]
After=box-loop.service box-net.service box-endpoint-8090.socket box-ssh-keys.service box.service
Requires=box-loop.service box-net.service box-endpoint-8090.socket box-ssh-keys.service box.service

[Service]
BindReadOnlyPaths=/run/tundravm/containers/box/host:/etc/ssh/tundravm/host
BindReadOnlyPaths=/run/tundravm/containers/box/keys:/etc/ssh/tundravm/keys
MountAPIVFS=yes
NetworkNamespacePath=/run/netns/box
PrivatePIDs=yes
PrivateUsers=yes
ProtectProc=invisible
RootImage=/usr/lib/tundravm/containers/box.raw
