# tundravm TeeBase
# Authenticated NTS sources
server time.cloudflare.com iburst nts
server nts.netnod.se iburst nts
# Hypervisor clocks refine them; authselectmode mix (the default) keeps an
# unauthenticated source from overruling the NTS ones
server 169.254.169.254 iburst minpoll 4 maxpoll 4
server 169.254.169.123 iburst minpoll 4 maxpoll 4
# Reject a source whose root distance exceeds one second
maxdistance 1.0
driftfile /var/lib/chrony/chrony.drift
ntsdumpdir /var/lib/chrony
# Step the clock in the first three updates if it is off by more than a second
makestep 1 3
rtcsync
maxupdateskew 100.0
