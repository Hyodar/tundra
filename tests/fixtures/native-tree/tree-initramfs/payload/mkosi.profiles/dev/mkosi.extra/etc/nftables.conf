#!/usr/sbin/nft -f
# tundravm Firewall: inbound traffic is dropped unless a rule below accepts it;
# outbound traffic is dropped unless a rule in the output chain accepts it.
# The cloud metadata servers take only what the units that declare them send.
# Host names: egress-resolve fills each host4_/host6_ set from DNS over TLS at
# boot and every 30s; a rule naming one accepts nothing until it has.
# Modes: mode-switch swaps mode_input/mode_output and current_mode; a flow
# keeps its mode's ct mark and drops once another mode is in force.
flush ruleset

table inet filter {
	set current_mode {
		type mark
		elements = { 0x00000001 }
	}
	set host4_time.cloudflare.com {
		type ipv4_addr
	}
	set host6_time.cloudflare.com {
		type ipv6_addr
	}
	set host4_nts.netnod.se {
		type ipv4_addr
	}
	set host6_nts.netnod.se {
		type ipv6_addr
	}
	chain production_input {
	}
	chain maintenance_input {
		tcp dport 22 ct mark set 0x00000002 accept comment "maintenance: ssh.service"
		tcp dport 8082 ct mark set 0x00000002 accept comment "maintenance: box"
	}
	chain mode_input {
		jump production_input
	}
	chain input {
		type filter hook input priority filter; policy drop;
		ct state established,related ct mark 0x00000000 accept
		ct state established,related ct mark @current_mode accept
		ct state invalid drop
		iifname "lo" accept
		iifname "ve-box" meta l4proto tcp reject with tcp reset comment "box: not the host"
		iifname "ve-box" reject with icmpx type admin-prohibited comment "box: not the host"
		icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept
		udp sport 67 udp dport 68 accept comment "DHCPv4 replies"
		ip6 saddr fe80::/10 udp sport 547 udp dport 546 accept comment "DHCPv6 replies"
		tcp dport 8080 accept comment "web.service"
		tcp dport 8443 accept comment "attested-tls-8443.service"
		tcp dport 8745 accept comment "attested-endpoint"
		jump mode_input
	}
	chain forward {
		type filter hook forward priority filter; policy drop;
		ct state established,related ct mark 0x00000000 accept
		ct state established,related ct mark @current_mode accept
		ct state invalid drop
		iifname "ve-box" ip daddr { 168.63.129.16, 169.254.169.254 } meta l4proto tcp reject with tcp reset comment "box: cloud metadata"
		iifname "ve-box" ip daddr { 168.63.129.16, 169.254.169.254 } reject with icmpx type admin-prohibited comment "box: cloud metadata"
		iifname "ve-box" ip6 daddr fd20:ce::254 meta l4proto tcp reject with tcp reset comment "box: cloud metadata"
		iifname "ve-box" ip6 daddr fd20:ce::254 reject with icmpx type admin-prohibited comment "box: cloud metadata"
		iifname "ve-box" ip daddr 1.1.1.1 tcp dport 853 accept comment "box"
		iifname "ve-box" ip daddr 1.0.0.1 tcp dport 853 meta mark set 0x00000002 meta mark @current_mode ct mark set meta mark accept comment "box: maintenance"
		iifname "ve-box" meta l4proto tcp reject with tcp reset comment "box: no egress rule"
		iifname "ve-box" reject with icmpx type admin-prohibited comment "box: no egress rule"
		oifname "ve-box" ct status dnat tcp dport 8081 accept comment "box"
		oifname "ve-box" ct status dnat udp dport 9999 accept comment "box"
		oifname "ve-box" ct status dnat tcp dport 10022 accept comment "box"
		oifname "ve-box" ct status dnat jump mode_input
	}
	chain prerouting {
		type nat hook prerouting priority dstnat; policy accept;
		tcp dport 8081 dnat ip to 169.254.136.254 comment "box"
		tcp dport 8082 dnat ip to 169.254.136.254 comment "box"
		udp dport 9999 dnat ip to 169.254.136.254 comment "box"
		tcp dport 10022 dnat ip to 169.254.136.254 comment "box"
	}
	chain postrouting {
		type nat hook postrouting priority srcnat; policy accept;
		ip saddr 169.254.136.254 oifname != "ve-box" masquerade comment "box"
	}
	chain production_output {
	}
	chain maintenance_output {
	}
	chain mode_output {
		jump production_output
	}
	chain output {
		type filter hook output priority filter; policy drop;
		ct state established,related ct mark 0x00000000 accept
		ct state established,related ct mark @current_mode accept
		ct state invalid drop
		oifname "lo" accept
		icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept
		meta skuid "systemd-network" udp sport 68 udp dport 67 accept comment "DHCPv4 requests"
		meta skuid "systemd-network" udp sport 546 udp dport 547 accept comment "DHCPv6 requests"
		meta skuid 0 meta skgid "azure-complete-provisioning" ip daddr 168.63.129.16 accept comment "azure-complete-provisioning.service"
		meta skuid 0 meta skgid "gcp-hostname" ip daddr 169.254.169.254 accept comment "gcp-hostname.service"
		meta skuid 0 meta skgid "gcp-forwarded-ips" ip daddr 169.254.169.254 accept comment "gcp-forwarded-ips.service"
		ip daddr 169.254.169.254 udp dport 123 accept comment "metadata time"
		ip daddr { 168.63.129.16, 169.254.169.254 } drop comment "cloud metadata"
		ip6 daddr fd20:ce::254 drop comment "cloud metadata"
		oifname "ve-box" ip daddr 169.254.136.254 tcp dport 8081 accept comment "box: serves"
		meta skuid "_chrony" udp dport 123 accept comment "tee-base"
		meta skuid "_chrony" ip daddr @host4_time.cloudflare.com tcp dport 4460 accept comment "tee-base"
		meta skuid "_chrony" ip6 daddr @host6_time.cloudflare.com tcp dport 4460 accept comment "tee-base"
		meta skuid "_chrony" ip daddr @host4_nts.netnod.se tcp dport 4460 accept comment "tee-base"
		meta skuid "_chrony" ip6 daddr @host6_nts.netnod.se tcp dport 4460 accept comment "tee-base"
		meta skuid "systemd-resolve" ip daddr 1.1.1.1 tcp dport 853 accept comment "network"
		meta skuid "systemd-resolve" ip daddr 1.0.0.1 tcp dport 853 accept comment "network"
		meta skuid "journal-export" ip daddr 127.0.0.1 tcp dport 19582 accept comment "observability"
		meta skuid "metrics-export" ip daddr 127.0.0.1 tcp dport 19582 accept comment "observability"
		jump mode_output
	}
}
